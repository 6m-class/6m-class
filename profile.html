<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профиль | Самый лучший класс</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="settings.js"></script>
<style>
:root{--primary:#ff0033;--primary-rgb:255,0,51;--glow:rgba(255,0,51,0.15);--glow-strong:rgba(255,0,51,0.8);--border:rgba(255,0,51,0.3);--shadow:rgba(255,0,51,0.2)}
[data-theme="yellow"]{--primary:#ffcc00;--primary-rgb:255,204,0;--glow:rgba(255,204,0,0.15);--glow-strong:rgba(255,204,0,0.8);--border:rgba(255,204,0,0.3);--shadow:rgba(255,204,0,0.2)}
[data-theme="green"]{--primary:#00ff66;--primary-rgb:0,255,102;--glow:rgba(0,255,102,0.15);--glow-strong:rgba(0,255,102,0.8);--border:rgba(0,255,102,0.3);--shadow:rgba(0,255,102,0.2)}
[data-theme="blue"]{--primary:#00aaff;--primary-rgb:0,170,255;--glow:rgba(0,170,255,0.15);--glow-strong:rgba(0,170,255,0.8);--border:rgba(0,170,255,0.3);--shadow:rgba(0,170,255,0.2)}
[data-theme="purple"]{--primary:#aa00ff;--primary-rgb:170,0,255;--glow:rgba(170,0,255,0.15);--glow-strong:rgba(170,0,255,0.8);--border:rgba(170,0,255,0.3);--shadow:rgba(170,0,255,0.2)}
[data-theme="aero"]{--primary:#00ffff;--primary-rgb:0,255,255;--glow:rgba(0,255,255,0.15);--glow-strong:rgba(0,255,255,0.8);--border:rgba(0,255,255,0.3);--shadow:rgba(0,255,255,0.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;padding:20px}
.bg-glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100vw;height:50vh;background:radial-gradient(ellipse at top,var(--glow),transparent 70%);z-index:-2;pointer-events:none}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.particle{position:absolute;background:var(--primary);border-radius:50%;box-shadow:0 0 5px var(--primary);animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:0.4}100%{transform:translateY(-10vh) scale(1);opacity:0}}
nav{width:100%;max-width:600px;padding:12px 0;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.nav-left{display:flex;gap:10px;align-items:center}
.nav-btn{color:#fff;text-decoration:none;font-weight:700;text-transform:uppercase;font-size:.85rem;padding:8px 16px;border:1px solid rgba(255,255,255,0.3);border-radius:4px;transition:.3s;cursor:pointer}
.nav-btn:hover{border-color:var(--primary);color:var(--primary)}
.logout-btn{padding:8px 16px;border:1px solid rgba(255,80,80,0.3);border-radius:4px;background:transparent;color:#ff5555;font-size:.85rem;cursor:pointer;transition:.3s;font-family:'Montserrat',sans-serif;font-weight:700}
.logout-btn:hover{background:rgba(255,80,80,0.1);border-color:#ff5555}
.profile-card{background:rgba(20,20,20,0.6);border:1px solid var(--border);border-radius:12px;padding:30px;width:100%;max-width:500px;text-align:center;box-shadow:0 0 60px rgba(var(--primary-rgb),0.1);position:relative;z-index:10}
.avatar-wrap{position:relative;width:120px;height:120px;margin:0 auto 20px;cursor:pointer}
.avatar{width:120px;height:120px;border-radius:50%;border:3px solid var(--primary);object-fit:cover;box-shadow:0 0 25px var(--shadow);background:rgba(255,255,255,0.05)}
.avatar-placeholder{width:120px;height:120px;border-radius:50%;border:3px solid var(--primary);background:rgba(var(--primary-rgb),0.1);display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-family:'Orbitron',sans-serif;font-weight:900;color:var(--primary);box-shadow:0 0 25px var(--shadow)}
.avatar-upload-btn{position:absolute;bottom:-5px;right:-5px;width:36px;height:36px;border-radius:50%;background:var(--primary);border:2px solid #050505;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:.3s}
.avatar-upload-btn:hover{transform:scale(1.15);box-shadow:0 0 15px var(--shadow)}
.avatar-wrap.uploading .avatar-upload-btn{animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.profile-name{font-family:'Orbitron',sans-serif;font-size:1.4rem;margin-bottom:5px}
.profile-info{display:flex;gap:30px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.info-item{text-align:center}
.info-label{font-size:.75rem;color:#555;text-transform:uppercase;margin-bottom:3px}
.info-value{font-size:1.1rem;font-weight:700}
.info-value span{color:var(--primary)}
.status-msg{font-size:.85rem;min-height:20px;margin-top:10px}
.status-msg.ok{color:#00ff66}
.status-msg.err{color:#ff5555}
@media(max-width:600px){.profile-card{padding:20px 15px}.profile-info{gap:15px}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="particles" id="particles"></div>
<nav>
<div class="nav-left">
<a href="index.html" class="nav-btn">← Главная</a>
<a href="chat.html" class="nav-btn">💬 Чат</a>
</div>
<button class="logout-btn" onclick="logout()">Выйти</button>
</nav>
<div class="profile-card">
<div class="avatar-wrap" id="avatarWrap" onclick="document.getElementById('fileInput').click()"></div>
<div class="profile-name" id="profileName"></div>
<div class="profile-info">
<div class="info-item"><div class="info-label">Логин</div><div class="info-value" id="profileLogin"></div></div>
<div class="info-item"><div class="info-label">Роль</div><div class="info-value" id="profileRole"></div></div>
<div class="info-item"><div class="info-label">Сообщений</div><div class="info-value" id="profileMsgCount"><span>0</span></div></div>
</div>
<div class="status-msg" id="statusMsg"></div>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<script src="settings.js"></script>
<script>
const REPO='6m-class/6m-class';
const API=`https://api.github.com/repos/${REPO}`;
const _k='6m-class';const _e=[81,4,89,11,25,3,44,3,87,25,114,82,93,35,64,56,127,52,98,50,92,15,18,61,119,24,87,80,56,6,29,69,83,50,28,84,30,50,38,10,80,39,65,49,89,34,27,52,64,12,124,4,0,45,23,2,66,8,96,25,20,89,20,55,123,7,68,1,40,84,39,7,111,42,21,40,38,59,65,64,99,88,103,32,33,83,21,5,78,6,26,20,61];
const TOKEN=_e.map((c,i)=>String.fromCharCode(c^_k.charCodeAt(i%_k.length))).join('');
const user=JSON.parse(localStorage.getItem('class_user')||'null');
if(!user){window.location.href='login.html';}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function utf8ToB64(str){return btoa([...new TextEncoder().encode(str)].map(b=>String.fromCharCode(b)).join(''))}
const headers={'Authorization':`Bearer ${TOKEN}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
async function fetchJSON(url,opts={},ms=15000){
const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
const r=await fetch(url,{...opts,signal:c.signal});
const data=await r.json().catch(()=>({message:'JSON parse error'}));
if(!r.ok)throw new Error(data.message||('HTTP '+r.status));
return data;
}
function renderAvatar(url){
const wrap=document.getElementById('avatarWrap');
if(url){
wrap.innerHTML=`<img class="avatar" src="${url}" alt=""><div class="avatar-upload-btn">📷</div>`;
}else{
const letter=(user.name||'?')[0].toUpperCase();
wrap.innerHTML=`<div class="avatar-placeholder">${esc(letter)}</div><div class="avatar-upload-btn">📷</div>`;
}
}
document.getElementById('profileName').innerHTML=esc(user.name)+(user.role==='admin'?' 👑':'');
document.getElementById('profileLogin').textContent=user.login;
document.getElementById('profileRole').innerHTML=user.role==='admin'?'<span>Админ 👑</span>':'Ученик';
async function loadProfile(){
try{
const resp=await fetch(`https://raw.githubusercontent.com/${REPO}/main/accounts.json?v=${Date.now()}`,{cache:'no-store'});
if(resp.ok){
const accounts=await resp.json();
const acc=accounts.find(a=>a.login===user.login);
if(acc&&acc.avatar){
renderAvatar(acc.avatar+'?t='+Date.now());
localStorage.setItem('class_avatar',acc.avatar);
}else{
renderAvatar(localStorage.getItem('class_avatar')||null);
}
}else{
renderAvatar(localStorage.getItem('class_avatar')||null);
}
const msgCount=await countMessages();
document.getElementById('profileMsgCount').innerHTML=`<span>${msgCount}</span>`;
}catch(e){
renderAvatar(localStorage.getItem('class_avatar')||null);
}
}
async function countMessages(){
try{
const issues=await fetchJSON(`${API}/issues?labels=${encodeURIComponent('чат')}&state=open&per_page=5&t=${Date.now()}`,{cache:'no-store',headers},10000);
const chat=issues.find(i=>!i.pull_request);
if(!chat)return 0;
const comments=await fetchJSON(`${API}/issues/${chat.number}/comments?per_page=100&t=${Date.now()}`,{cache:'no-store',headers},10000);
return comments.filter(c=>{try{const p=JSON.parse(c.body);return p.login===user.login||p.name===user.name;}catch(e){return false;}}).length;
}catch(e){return 0;}
}
document.getElementById('fileInput').addEventListener('change',async e=>{
const file=e.target.files[0];
if(!file)return;
const status=document.getElementById('statusMsg');
if(file.size>50000000000){
status.textContent='❌ Файл слишком большой';
status.className='status-msg err';
return;
}
const wrap=document.getElementById('avatarWrap');
wrap.classList.add('uploading');
status.textContent='⏳ Загрузка...';
status.className='status-msg';
try{
const reader=new FileReader();
const base64=await new Promise((res,rej)=>{reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(file);});
const base64Data=base64.split(',')[1];
const ext=file.name.split('.').pop().toLowerCase().substring(0,4);
const fileName=`avatars/${user.login}_${Date.now()}.${ext}`;
const path=encodeURIComponent(fileName);
const fileResp=await fetchJSON(`${API}/contents/${path}`,{
method:'PUT',
headers:{...headers,'Content-Type':'application/json'},
body:JSON.stringify({message:`Upload avatar for ${user.login}`,content:base64Data})
},30000);
const rawUrl=(fileResp.content&&fileResp.content.download_url)||`https://raw.githubusercontent.com/${REPO}/main/${fileName}`;
await new Promise(r=>setTimeout(r,2000));
const resp=await fetch(`https://raw.githubusercontent.com/${REPO}/main/accounts.json?v=${Date.now()}`,{cache:'no-store'});
let accounts=[];
if(resp.ok){accounts=await resp.json();if(!Array.isArray(accounts))accounts=[];}
const acc=accounts.find(a=>a.login===user.login);
if(acc){acc.avatar=rawUrl;}else{accounts.push({name:user.name,login:user.login,role:user.role,avatar:rawUrl});}
const newData=JSON.stringify(accounts,null,2);
const newDataB64=utf8ToB64(newData);
let sha=null;
try{const dataMeta=await fetchJSON(`${API}/contents/accounts.json`,{cache:'no-store',headers},10000);sha=dataMeta.sha;}catch(e){}
const putBody={message:`Update avatar for ${user.login}`,content:newDataB64};
if(sha)putBody.sha=sha;
await fetchJSON(`${API}/contents/accounts.json`,{
method:'PUT',
headers:{...headers,'Content-Type':'application/json'},
body:JSON.stringify(putBody)
},15000);
renderAvatar(rawUrl+'?t='+Date.now());
localStorage.setItem('class_avatar',rawUrl);
status.textContent='✅ Фото сохранено!';
status.className='status-msg ok';
}catch(e){
status.textContent='❌ '+e.message;
status.className='status-msg err';
}finally{
wrap.classList.remove('uploading');
document.getElementById('fileInput').value='';
}
});
function logout(){localStorage.removeItem('class_user');localStorage.removeItem('class_avatar');window.location.href='login.html';}
loadProfile();
const isMobile=window.innerWidth<600;const pc=document.getElementById('particles');const count=isMobile?10:20;
for(let i=0;i<count;i++){
const p=document.createElement('div');p.classList.add('particle');
const s=Math.random()*3+1;p.style.width=`${s}px`;p.style.height=`${s}px`;
p.style.left=`${Math.random()*100}vw`;
p.style.animationDuration=`${Math.random()*10+6}s`;
p.style.animationDelay=`${Math.random()*5}s`;
pc.appendChild(p);
}
</script>
</body>
</html>
