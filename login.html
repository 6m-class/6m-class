<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход | Самый лучший класс</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#ff0033;--primary-rgb:255,0,51;--glow:rgba(255,0,51,0.15);--glow-strong:rgba(255,0,51,0.8);--border:rgba(255,0,51,0.3);--shadow:rgba(255,0,51,0.2)}
[data-theme="yellow"]{--primary:#ffcc00;--primary-rgb:255,204,0;--glow:rgba(255,204,0,0.15);--glow-strong:rgba(255,204,0,0.8);--border:rgba(255,204,0,0.3);--shadow:rgba(255,204,0,0.2)}
[data-theme="green"]{--primary:#00ff66;--primary-rgb:0,255,102;--glow:rgba(0,255,102,0.15);--glow-strong:rgba(0,255,102,0.8);--border:rgba(0,255,102,0.3);--shadow:rgba(0,255,102,0.2)}
[data-theme="blue"]{--primary:#00aaff;--primary-rgb:0,170,255;--glow:rgba(0,170,255,0.15);--glow-strong:rgba(0,170,255,0.8);--border:rgba(0,170,255,0.3);--shadow:rgba(0,170,255,0.2)}
[data-theme="purple"]{--primary:#aa00ff;--primary-rgb:170,0,255;--glow:rgba(170,0,255,0.15);--glow-strong:rgba(170,0,255,0.8);--border:rgba(170,0,255,0.3);--shadow:rgba(170,0,255,0.2)}
[data-theme="aero"]{--primary:#00ffff;--primary-rgb:0,255,255;--glow:rgba(0,255,255,0.15);--glow-strong:rgba(0,255,255,0.8);--border:rgba(0,255,255,0.3);--shadow:rgba(0,255,255,0.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden}
.bg-glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100vw;height:50vh;background:radial-gradient(ellipse at top,var(--glow),transparent 70%);z-index:-2;pointer-events:none}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.particle{position:absolute;background:var(--primary);border-radius:50%;box-shadow:0 0 5px var(--primary);animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:0.4}100%{transform:translateY(-10vh) scale(1);opacity:0}}
nav{padding:20px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(5,5,5,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.back-btn{color:#fff;text-decoration:none;font-weight:700;text-transform:uppercase;font-size:.9rem;padding:8px 20px;border:1px solid rgba(255,255,255,0.3);border-radius:4px;transition:.3s}
.back-btn:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 0 10px var(--shadow)}
.gear-link{font-size:1.4rem;text-decoration:none;opacity:.5;transition:.3s;filter:grayscale(1)}
.gear-link:hover{opacity:1;color:var(--primary);filter:none}
.login-wrap{max-width:440px;margin:0 auto;padding:40px 20px;min-height:calc(100vh - 70px);display:flex;flex-direction:column;justify-content:center}
h1{font-family:'Orbitron',sans-serif;font-size:clamp(2rem,5vw,3rem);text-align:center;margin-bottom:10px;text-transform:uppercase;text-shadow:0 0 15px var(--glow-strong)}
.highlight{color:var(--primary)}
.subtitle{text-align:center;color:#888;margin-bottom:40px;font-size:1rem}
.login-card{background:rgba(20,20,20,0.6);border:1px solid var(--border);border-radius:12px;padding:35px 30px}
.field{margin-bottom:18px}
.field label{display:block;font-size:.75rem;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:12px 15px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#fff;font-family:'Montserrat',sans-serif;font-size:.95rem;outline:none;transition:.3s}
.field input:focus{border-color:var(--primary);box-shadow:0 0 12px var(--shadow)}
.btn{padding:12px 25px;border-radius:8px;border:none;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;cursor:pointer;transition:.3s;letter-spacing:.5px;width:100%}
.btn-primary{background:var(--primary);color:#000}
.btn-primary:hover{box-shadow:0 0 20px var(--shadow);transform:translateY(-2px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg{margin-top:12px;font-size:.85rem;min-height:20px;text-align:center}
.hint{text-align:center;color:#555;font-size:.85rem;margin-top:25px}
@media(max-width:600px){nav{padding:12px 15px}.login-wrap{padding:30px 15px}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="particles" id="particles"></div>
<nav>
<a href="index.html" class="back-btn">&#8592; На главную</a>
<a href="settings.html" class="gear-link" title="Настройки">&#9881;</a>
</nav>
<div class="login-wrap">
<h1>Вход в <span class="highlight">чат</span></h1>
<p class="subtitle">Войдите, чтобы общаться с классом</p>
<div class="login-card">
<div class="field">
<label>Логин</label>
<input type="text" id="loginInput" placeholder="Ваш логин" onkeydown="if(event.key==='Enter')document.getElementById('passwordInput').focus()">
</div>
<div class="field">
<label>Пароль</label>
<input type="password" id="passwordInput" placeholder="Ваш пароль" onkeydown="if(event.key==='Enter')doLogin()">
</div>
<button class="btn btn-primary" id="loginBtn" onclick="doLogin()">🔑 Войти</button>
<div class="msg" id="loginMsg"></div>
</div>
<p class="hint">Нет аккаунта? Обратитесь к администратору класса</p>
</div>
<script src="settings.js"></script>
<script>
const REPO='6m-class/6m-class';
async function doLogin(){
const login=document.getElementById('loginInput').value.trim();
const password=document.getElementById('passwordInput').value.trim();
if(!login||!password){document.getElementById('loginMsg').textContent='❌ Заполни логин и пароль';document.getElementById('loginMsg').style.color='#ff5555';return}
const btn=document.getElementById('loginBtn');
btn.disabled=true;btn.textContent='⏳ Проверка...';
document.getElementById('loginMsg').textContent='';
try{
const res=await fetch(`https://raw.githubusercontent.com/${REPO}/main/data.json?t=${Date.now()}`);
if(!res.ok)throw new Error('Не удалось загрузить данные');
const data=await res.json();
const accounts=data.accounts||[];
const found=accounts.find(a=>a.login===login&&a.password===password);
if(found){
localStorage.setItem('session_user',JSON.stringify({login:found.login,name:found.name,role:found.role||'student'}));
window.location.href='chat.html';
}else{
btn.disabled=false;btn.textContent='🔑 Войти';
document.getElementById('loginMsg').textContent='❌ Неверный логин или пароль';
document.getElementById('loginMsg').style.color='#ff5555';
}
}catch(e){
btn.disabled=false;btn.textContent='🔑 Войти';
document.getElementById('loginMsg').textContent='❌ '+e.message;
document.getElementById('loginMsg').style.color='#ff5555';
}
}
// Particles
const isMobile=window.innerWidth<600;
const pc=document.getElementById('particles');
const count=isMobile?12:25;
for(let i=0;i<count;i++){
const p=document.createElement('div');p.classList.add('particle');
const s=Math.random()*3+1;
p.style.width=`${s}px`;p.style.height=`${s}px`;
p.style.left=`${Math.random()*100}vw`;
p.style.animationDuration=`${Math.random()*10+6}s`;
p.style.animationDelay=`${Math.random()*5}s`;
pc.appendChild(p);
}
</script>
</body>
</html>
