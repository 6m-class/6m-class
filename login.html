<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход | Самый лучший класс</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="settings.js"></script>
<style>
:root{--primary:#ff0033;--primary-rgb:255,0,51;--glow:rgba(255,0,51,0.15);--glow-strong:rgba(255,0,51,0.8);--border:rgba(255,0,51,0.3);--shadow:rgba(255,0,51,0.2)}
[data-theme="yellow"]{--primary:#ffcc00;--primary-rgb:255,204,0;--glow:rgba(255,204,0,0.15);--glow-strong:rgba(255,204,0,0.8);--border:rgba(255,204,0,0.3);--shadow:rgba(255,204,0,0.2)}
[data-theme="green"]{--primary:#00ff66;--primary-rgb:0,255,102;--glow:rgba(0,255,102,0.15);--glow-strong:rgba(0,255,102,0.8);--border:rgba(0,255,102,0.3);--shadow:rgba(0,255,102,0.2)}
[data-theme="blue"]{--primary:#00aaff;--primary-rgb:0,170,255;--glow:rgba(0,170,255,0.15);--glow-strong:rgba(0,170,255,0.8);--border:rgba(0,170,255,0.3);--shadow:rgba(0,170,255,0.2)}
[data-theme="purple"]{--primary:#aa00ff;--primary-rgb:170,0,255;--glow:rgba(170,0,255,0.15);--glow-strong:rgba(170,0,255,0.8);--border:rgba(170,0,255,0.3);--shadow:rgba(170,0,255,0.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden;display:flex;align-items:center;justify-content:center;padding:20px}
.bg-glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100vw;height:50vh;background:radial-gradient(ellipse at top,var(--glow),transparent 70%);z-index:-2;pointer-events:none}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.particle{position:absolute;background:var(--primary);border-radius:50%;box-shadow:0 0 5px var(--primary);animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:0.4}100%{transform:translateY(-10vh) scale(1);opacity:0}}
.login-box{background:rgba(20,20,20,0.6);border:1px solid var(--border);border-radius:12px;padding:40px 30px;width:100%;max-width:400px;text-align:center;box-shadow:0 0 60px rgba(var(--primary-rgb),0.1);z-index:10;position:relative}
.login-box h1{font-family:'Orbitron',sans-serif;font-size:1.4rem;margin-bottom:8px;text-transform:uppercase}
.login-box h1 span{color:var(--primary)}
.login-box p{color:#666;font-size:.85rem;margin-bottom:25px}
.login-box input{width:100%;padding:14px 18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#fff;font-size:.9rem;outline:none;transition:.3s;margin-bottom:12px;font-family:'Montserrat',sans-serif}
.login-box input:focus{border-color:var(--primary);box-shadow:0 0 15px rgba(var(--primary-rgb),0.3)}
.login-box button{width:100%;padding:14px;background:var(--primary);border:none;border-radius:8px;color:#000;font-family:'Orbitron',sans-serif;font-weight:700;font-size:1rem;text-transform:uppercase;cursor:pointer;transition:.3s;margin-top:5px}
.login-box button:hover{box-shadow:0 0 25px rgba(var(--primary-rgb),0.6);transform:translateY(-2px)}
.login-box button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.login-error{color:#ff5555;font-size:.85rem;margin-top:10px;min-height:20px}
.login-hint{margin-top:20px;font-size:.75rem;color:#555}
.back-btn{display:inline-block;margin-top:15px;color:#666;text-decoration:none;font-size:.8rem;transition:.3s}
.back-btn:hover{color:var(--primary)}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="particles" id="particles"></div>
<div class="login-box">
<h1>Вход в <span>класс</span></h1>
<p>Войдите, чтобы открыть чат</p>
<input type="text" id="loginInput" placeholder="Логин" onkeydown="if(event.key==='Enter')document.getElementById('passInput').focus()">
<input type="password" id="passInput" placeholder="Пароль" onkeydown="if(event.key==='Enter')doLogin()">
<button id="loginBtn" onclick="doLogin()">🔑 Войти</button>
<div class="login-error" id="loginError"></div>
<a href="index.html" class="back-btn">← На главную</a>
</div>
<script src="settings.js"></script>
<script>
const REPO='6m-class/6m-class';
async function loadDataJson(){
const urls=[
`https://raw.githubusercontent.com/${REPO}/main/data.json?v=${Date.now()}`,
`https://raw.githubusercontent.com/${REPO}/master/data.json?v=${Date.now()}`,
`https://cdn.jsdelivr.net/gh/${REPO}@main/data.json?v=${Date.now()}`,
`data.json?v=${Date.now()}`
];
for(const url of urls){
try{
const c=new AbortController();
const t=setTimeout(()=>c.abort(),8000);
const r=await fetch(url,{cache:'no-store',signal:c.signal});
clearTimeout(t);
if(r.ok)return await r.json();
}catch(e){continue}
}
return null;
}
async function doLogin(){
const login=document.getElementById('loginInput').value.trim();
const pass=document.getElementById('passInput').value.trim();
const err=document.getElementById('loginError');
const btn=document.getElementById('loginBtn');
if(!login||!pass){err.textContent='❌ Введи логин и пароль';return;}
btn.disabled=true;btn.textContent='⏳ Проверка...';err.textContent='';
try{
const data=await loadDataJson();
if(!data){err.textContent='❌ Не удалось загрузить данные. Проверь интернет.';btn.disabled=false;btn.textContent='🔑 Войти';return;}
const accounts=Array.isArray(data.accounts)?data.accounts:[];
if(accounts.length===0){err.textContent='❌ Аккаунтов пока нет. Попроси админа создать.';btn.disabled=false;btn.textContent='🔑 Войти';return;}
const acc=accounts.find(a=>a.login===login&&a.password===pass);
if(!acc){err.textContent='❌ Неправильный логин или пароль';btn.disabled=false;btn.textContent='🔑 Войти';return;}
localStorage.setItem('class_user',JSON.stringify({login:acc.login,name:acc.name,role:acc.role}));
window.location.href='chat.html';
}catch(e){
err.textContent='❌ Ошибка: '+e.message;btn.disabled=false;btn.textContent='🔑 Войти';
}
}
// Проверка — уже залогинен?
const saved=localStorage.getItem('class_user');
if(saved){window.location.href='chat.html';}
// Particles
const isMobile=window.innerWidth<600;
const pc=document.getElementById('particles');
const count=isMobile?12:25;
for(let i=0;i<count;i++){
const p=document.createElement('div');p.classList.add('particle');
const s=Math.random()*3+1;
p.style.width=`${s}px`;p.style.height=`${s}px`;
p.style.left=`${Math.random()*100}vw`;
p.style.animationDuration=`${Math.random()*10+6}s`;
p.style.animationDelay=`${Math.random()*5}s`;
pc.appendChild(p);
}
</script>
</body>
</html>
