<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход | Самый лучший класс</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="settings.js"></script>
<style>
:root{--primary:#ff0033;--primary-rgb:255,0,51;--glow:rgba(255,0,51,0.15);--glow-strong:rgba(255,0,51,0.8);--border:rgba(255,0,51,0.3);--shadow:rgba(255,0,51,0.2)}
[data-theme="yellow"]{--primary:#ffcc00;--primary-rgb:255,204,0;--glow:rgba(255,204,0,0.15);--glow-strong:rgba(255,204,0,0.8);--border:rgba(255,204,0,0.3);--shadow:rgba(255,204,0,0.2)}
[data-theme="green"]{--primary:#00ff66;--primary-rgb:0,255,102;--glow:rgba(0,255,102,0.15);--glow-strong:rgba(0,255,102,0.8);--border:rgba(0,255,102,0.3);--shadow:rgba(0,255,102,0.2)}
[data-theme="blue"]{--primary:#00aaff;--primary-rgb:0,170,255;--glow:rgba(0,170,255,0.15);--glow-strong:rgba(0,170,255,0.8);--border:rgba(0,170,255,0.3);--shadow:rgba(0,170,255,0.2)}
[data-theme="purple"]{--primary:#aa00ff;--primary-rgb:170,0,255;--glow:rgba(170,0,255,0.15);--glow-strong:rgba(170,0,255,0.8);--border:rgba(170,0,255,0.3);--shadow:rgba(170,0,255,0.2)}
[data-theme="aero"]{--primary:#00ffff;--primary-rgb:0,255,255;--glow:rgba(0,255,255,0.15);--glow-strong:rgba(0,255,255,0.8);--border:rgba(0,255,255,0.3);--shadow:rgba(0,255,255,0.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden;display:flex;align-items:center;justify-content:center;padding:20px}
.bg-glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100vw;height:50vh;background:radial-gradient(ellipse at top,var(--glow),transparent 70%);z-index:-2;pointer-events:none}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.particle{position:absolute;background:var(--primary);border-radius:50%;box-shadow:0 0 5px var(--primary);animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:0.4}100%{transform:translateY(-10vh) scale(1);opacity:0}}
.login-card{background:rgba(20,20,20,0.6);border:1px solid var(--border);border-radius:12px;padding:35px;width:100%;max-width:400px;box-shadow:0 0 60px rgba(var(--primary-rgb),0.1);position:relative;z-index:10}
.login-title{font-family:'Orbitron',sans-serif;font-size:1.6rem;text-align:center;margin-bottom:8px;text-transform:uppercase}
.login-title span{color:var(--primary)}
.login-sub{text-align:center;color:#888;font-size:.85rem;margin-bottom:25px}
.field{margin-bottom:18px}
.field label{display:block;font-size:.8rem;color:#aaa;margin-bottom:6px;text-transform:uppercase;font-weight:700}
.field input{width:100%;padding:12px 15px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#fff;font-size:.95rem;outline:none;transition:.3s;font-family:'Montserrat',sans-serif}
.field input:focus{border-color:var(--primary);box-shadow:0 0 12px var(--shadow)}
.login-btn{width:100%;padding:14px;background:var(--primary);border:none;border-radius:8px;color:#000;font-family:'Orbitron',sans-serif;font-weight:700;font-size:1rem;text-transform:uppercase;cursor:pointer;transition:.3s;margin-top:5px}
.login-btn:hover{box-shadow:0 0 25px var(--shadow);transform:translateY(-2px)}
.login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.reg-link{text-align:center;margin-top:18px;font-size:.85rem;color:#888}
.reg-link a{color:var(--primary);text-decoration:none;font-weight:700}
.reg-link a:hover{text-decoration:underline}
.status-msg{text-align:center;font-size:.85rem;min-height:20px;margin-top:10px}
.status-msg.ok{color:#00ff66}
.status-msg.err{color:#ff5555}
.back-link{position:fixed;top:20px;left:20px;color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;padding:8px 16px;border:1px solid rgba(255,255,255,0.3);border-radius:4px;transition:.3s;z-index:100}
.back-link:hover{border-color:var(--primary);color:var(--primary)}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="particles" id="particles"></div>
<a href="index.html" class="back-link">← Главная</a>
<div class="login-card">
<div class="login-title">Вход <span></span></div>
<div class="login-sub">Войдите в аккаунт класса</div>
<div class="field"><label>Логин</label><input type="text" id="loginInput" placeholder="ivan123" maxlength="20"></div>
<div class="field"><label>Пароль</label><input type="password" id="passInput" placeholder="••••••" maxlength="50"></div>
<button class="login-btn" id="loginBtn" onclick="doLogin()">Войти</button>
<div class="status-msg" id="statusMsg"></div>
<div class="reg-link">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></div>
</div>
<script src="settings.js"></script>
<script>
const REPO='6m-class/6m-class';
const API=`https://api.github.com/repos/${REPO}`;
const _k='6m-class';const _e=[81,4,89,11,25,3,44,3,87,25,114,82,93,35,64,56,127,52,98,50,92,15,18,61,119,24,87,80,56,6,29,69,83,50,28,84,30,50,38,10,80,39,65,49,89,34,27,52,64,12,124,4,0,45,23,2,66,8,96,25,20,89,20,55,123,7,68,1,40,84,39,7,111,42,21,40,38,59,65,64,99,88,103,32,33,83,21,5,78,6,26,20,61];
const TOKEN=_e.map((c,i)=>String.fromCharCode(c^_k.charCodeAt(i%_k.length))).join('');
const headers={'Authorization':`Bearer ${TOKEN}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
async function fetchJSON(url,opts={},ms=15000){
const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
const r=await fetch(url,{...opts,signal:c.signal});
const data=await r.json().catch(()=>({message:'JSON parse error'}));
if(!r.ok)throw new Error(data.message||('HTTP '+r.status));
return data;
}
async function doLogin(){
const login=document.getElementById('loginInput').value.trim();
const pass=document.getElementById('passInput').value;
const btn=document.getElementById('loginBtn');
const status=document.getElementById('statusMsg');
if(!login||!pass){status.textContent='❌ Заполните все поля';status.className='status-msg err';return;}
btn.disabled=true;btn.textContent='⏳ Вход...';status.textContent='';status.className='status-msg';
try{
const resp=await fetch(`https://raw.githubusercontent.com/${REPO}/main/accounts.json?v=${Date.now()}`,{cache:'no-store'});
if(!resp.ok){status.textContent='❌ Файл accounts.json не найден. Создайте его в репозитории.';status.className='status-msg err';btn.disabled=false;btn.textContent='Войти';return;}
const accounts=await resp.json();
const acc=accounts.find(a=>a.login===login&&a.password===pass);
if(!acc){status.textContent='❌ Неверный логин или пароль';status.className='status-msg err';btn.disabled=false;btn.textContent='Войти';return;}
localStorage.setItem('class_user',JSON.stringify({name:acc.name,login:acc.login,role:acc.role||'student'}));
if(acc.avatar)localStorage.setItem('class_avatar',acc.avatar);
status.textContent='✅ Вход выполнен!';status.className='status-msg ok';
setTimeout(()=>window.location.href='profile.html',1000);
}catch(e){
status.textContent='❌ Ошибка: '+e.message;
status.className='status-msg err';
btn.disabled=false;btn.textContent='Войти';
}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
const saved=JSON.parse(localStorage.getItem('class_user')||'null');
if(saved){window.location.href='profile.html';}
const isMobile=window.innerWidth<600;const pc=document.getElementById('particles');const count=isMobile?10:20;
for(let i=0;i<count;i++){
const p=document.createElement('div');p.classList.add('particle');
const s=Math.random()*3+1;p.style.width=`${s}px`;p.style.height=`${s}px`;
p.style.left=`${Math.random()*100}vw`;
p.style.animationDuration=`${Math.random()*10+6}s`;
p.style.animationDelay=`${Math.random()*5}s`;
pc.appendChild(p);
}
</script>
</body>
</html>
