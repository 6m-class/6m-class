
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мы | Самый лучший класс</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050505; color: #ffffff; font-family: 'Montserrat', sans-serif;
            min-height: 100vh; position: relative; overflow-x: hidden;
        }

        /* Фоновое свечение */
        .background-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255, 0, 51, 0.1) 0%, rgba(5, 5, 5, 0) 60%);
            z-index: -2; pointer-events: none;
        }

        /* Навигация */
        nav {
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 0, 51, 0.3); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900; color: #ff0033; text-shadow: 0 0 10px rgba(255,0,51,0.5); }
        .back-btn {
            color: #fff; text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: 0.9rem;
            padding: 8px 20px; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; transition: 0.3s;
        }
        .back-btn:hover { border-color: #ff0033; color: #ff0033; box-shadow: 0 0 10px rgba(255,0,51,0.3); }

        /* Основной контейнер */
        .container { max-width: 1200px; margin: 0 auto; padding: 60px 20px; }

        /* Секция Классного руководителя */
        .teacher-section {
            text-align: center; margin-bottom: 80px; padding: 40px;
            background: rgba(20, 20, 20, 0.5); border: 1px solid rgba(255, 0, 51, 0.2); border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            animation: fadeIn 1s ease-out;
        }
        .section-title {
            font-family: 'Orbitron', sans-serif; font-size: 2rem; margin-bottom: 30px; color: #fff;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .section-title span { color: #ff0033; text-shadow: 0 0 15px #ff0033; }
        
        .teacher-card {
            display: inline-flex; flex-direction: column; align-items: center; gap: 20px;
        }
        .teacher-photo {
            width: 200px; height: 200px; border-radius: 50%; object-fit: cover;
            border: 3px solid #ff0033; box-shadow: 0 0 20px rgba(255, 0, 51, 0.4);
            transition: transform 0.3s;
        }
        .teacher-photo:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 0, 51, 0.8); }
        .teacher-name { font-size: 1.5rem; font-weight: 700; }
        .teacher-role { color: #aaa; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }

        /* Сетка учащихся */
        .students-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px;
        }
        .student-card {
            background: rgba(20, 20, 20, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; overflow: hidden; transition: all 0.3s ease;
            position: relative;
        }
        .student-card:hover {
            transform: translateY(-10px); border-color: #ff0033;
            box-shadow: 0 10px 30px rgba(255, 0, 51, 0.2);
        }
        .student-img-wrapper {
            width: 100%; height: 250px; overflow: hidden; position: relative;
        }
        .student-img {
            width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; filter: grayscale(80%);
        }
        .student-card:hover .student-img { transform: scale(1.1); filter: grayscale(0%); }
        
        /* Красная полоса снизу карточки */
        .student-info {
            padding: 15px; text-align: center; background: #0a0a0a; border-top: 2px solid #ff0033;
        }
        .student-name { font-weight: 700; font-size: 1.1rem; color: #fff; }

        /* Анимации */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Частицы (упрощенные для второй страницы) */
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .particle { position: absolute; background: #ff0033; border-radius: 50%; box-shadow: 0 0 5px #ff0033; animation: floatUp linear infinite; opacity: 0; }
        @keyframes floatUp { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 50% { opacity: 0.5; } 100% { transform: translateY(-10vh) scale(1); opacity: 0; } }

    </style>
</head>
<body>

    <div class="background-glow"></div>
    <div class="particles" id="particles"></div>

    <nav>
        <div class="logo"><span style="color:#fff"></span></div>
        <a href="index.html" class="back-btn">← На главную</a>
    </nav>

    <div class="container">
        
        <!-- Блок Классного Руководителя -->
        <section class="teacher-section">
            <h2 class="section-title">Наш <span>Классный Руководитель</span></h2>
            <div class="teacher-card">
                <!-- ЗАМЕНИТЕ src НА ФОТО ВАШЕГО КЛАССРУКА -->
                <img src="C:\6М САЙТ\Photos\artur4ik.jpg">
                <div>
                    <div class="teacher-name">Карпетян Артур Арменович</div>
                </div>
            </div>
        </section>

        <!-- Блок Учеников -->
        <h2 class="section-title" style="text-align: center; margin-bottom: 40px;">Наша <span>Команда</span></h2>
        <div class="students-grid">
            
            <!-- Карточка ученика 1 -->
            <div class="student-card">
                <div class="student-img-wrapper">
                    <!-- ЗАМЕНИТЕ src НА ФОТО УЧЕНИКА -->
                    <img src="C:\6М САЙТ\Photos\Bezubi_demon.jpg">
                </div>
                <div class="student-info">
                    <div class="student-name"></div>
                </div>
            </div>

            <!-- Карточка ученика 2 -->
            <div class="student-card">
                <div class="student-img-wrapper">
                    <img src="C:\6М САЙТ\Photos\Xakeri_aple.jpg">
                </div>
                <div class="student-info">
                    <div class="student-name"></div>
                </div>
            </div>

            <!-- Карточка ученика 3 -->
            <div class="student-card">
                <div class="student-img-wrapper">
                    <img src="C:\6М САЙТ\Photos\dvijuxa.mp4">
                </div>
                <div class="student-info">
                    <div class="student-name"></div>
                </div>
            </div>

            <!-- Карточка ученика 4 -->
            <div class="student-card">
                <div class="student-img-wrapper">
                    <img src="https://via.placeholder.com/300x300/111/333?text=Ученик+4" alt="Ученик" class="student-img">
                </div>
                <div class="student-info">
                    <div class="student-name"></div>
                </div>
            </div>
            
            <!-- Чтобы добавить еще учеников, просто скопируйте блок <div class="student-card">...</div> и вставьте сюда -->

        </div>
    </div>

    <script>
        // Генерация частиц
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const size = Math.random() * 4 + 1;
            particle.style.width = `${size}px`; particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.animationDuration = `${Math.random() * 10 + 5}s`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>

<style>
:root { --primary:#ff0033; --glow:rgba(255,0,51,0.15); --glow-strong:rgba(255,0,51,0.8); --border:rgba(255,0,51,0.3); --shadow:rgba(255,0,51,0.2); }
[data-theme="blue"] { --primary:#00aaff; --glow:rgba(0,170,255,0.15); --glow-strong:rgba(0,170,255,0.8); --border:rgba(0,170,255,0.3); --shadow:rgba(0,170,255,0.2); }
[data-theme="green"] { --primary:#00ff66; --glow:rgba(0,255,102,0.15); --glow-strong:rgba(0,255,102,0.8); --border:rgba(0,255,102,0.3); --shadow:rgba(0,255,102,0.2); }
[data-theme="aero"] { --primary:#00ffff; --glow:rgba(0,255,255,0.15); --glow-strong:rgba(0,255,255,0.8); --border:rgba(0,255,255,0.3); --shadow:rgba(0,255,255,0.2); }

.theme-btn[data-set="green"] { background: #00ff66; color: #00ff66; }

.background-glow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 0%, var(--glow) 0%, rgba(5,5,5,0) 60%); z-index: -2; pointer-events: none; }

nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(5,5,5,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }

.students-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; }

.student-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 10px 30px var(--shadow); }

.student-name { font-weight: 700; font-size: 1.1rem; color: #fff; }

@keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

@keyframes floatUp { 0%{transform:translateY(100vh) scale(0);opacity:0} 50%{opacity:0.5} 100%{transform:translateY(-10vh) scale(1);opacity:0} }
</style>
</head>
<body>
<div class="theme-switcher">
    <div class="theme-btn active" data-set="red" title="Красная"></div>
    <div class="theme-btn" data-set="blue" title="Синяя"></div>
    <div class="theme-btn" data-set="green" title="Зелёная"></div>

<div class="background-glow"></div>

<script>

const pc=document.getElementById('particles');for(let i=0;i<30;i++){const p=document.createElement('div');p.classList.add('particle');const s=Math.random()*4+1;p.style.width=`${s}px`;p.style.height=`${s}px`;p.style.left=`${Math.random()*100}vw`;p.style.animationDuration=`${Math.random()*10+5}s`;p.style.animationDelay=`${Math.random()*5}s`;pc.appendChild(p);}
