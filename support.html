<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поддержка | Самый лучший класс</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#ff0033;--primary-rgb:255,0,51;--glow:rgba(255,0,51,0.15);--glow-strong:rgba(255,0,51,0.8);--border:rgba(255,0,51,0.3);--shadow:rgba(255,0,51,0.2)}
[data-theme="yellow"]{--primary:#ffcc00;--primary-rgb:255,204,0;--glow:rgba(255,204,0,0.15);--glow-strong:rgba(255,204,0,0.8);--border:rgba(255,204,0,0.3);--shadow:rgba(255,204,0,0.2)}
[data-theme="green"]{--primary:#00ff66;--primary-rgb:0,255,102;--glow:rgba(0,255,102,0.15);--glow-strong:rgba(0,255,102,0.8);--border:rgba(0,255,102,0.3);--shadow:rgba(0,255,102,0.2)}
[data-theme="blue"]{--primary:#00aaff;--primary-rgb:0,170,255;--glow:rgba(0,170,255,0.15);--glow-strong:rgba(0,170,255,0.8);--border:rgba(0,170,255,0.3);--shadow:rgba(0,170,255,0.2)}
[data-theme="purple"]{--primary:#aa00ff;--primary-rgb:170,0,255;--glow:rgba(170,0,255,0.15);--glow-strong:rgba(170,0,255,0.8);--border:rgba(170,0,255,0.3);--shadow:rgba(170,0,255,0.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden}
.bg-glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100vw;height:50vh;background:radial-gradient(ellipse at top,var(--glow),transparent 70%);z-index:-2;pointer-events:none}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.particle{position:absolute;background:var(--primary);border-radius:50%;box-shadow:0 0 5px var(--primary);animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:0.4}100%{transform:translateY(-10vh) scale(1);opacity:0}}
nav{padding:20px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(5,5,5,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.back-btn{color:#fff;text-decoration:none;font-weight:700;text-transform:uppercase;font-size:.9rem;padding:8px 20px;border:1px solid rgba(255,255,255,0.3);border-radius:4px;transition:.3s}
.back-btn:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 0 10px var(--shadow)}
.gear-link{font-size:1.4rem;text-decoration:none;opacity:.5;transition:.3s;filter:grayscale(1)}
.gear-link:hover{opacity:1;color:var(--primary);filter:none}
.container{max-width:800px;margin:0 auto;padding:60px 20px 80px}
h1{font-family:'Orbitron',sans-serif;font-size:clamp(2rem,5vw,3rem);text-align:center;margin-bottom:10px;text-transform:uppercase;text-shadow:0 0 15px var(--glow-strong)}
.highlight{color:var(--primary)}
.subtitle{text-align:center;color:#888;margin-bottom:50px;font-size:1rem}
.form-card{background:rgba(20,20,20,0.6);border:1px solid var(--border);border-radius:12px;padding:30px;margin-bottom:40px}
.form-card h2{font-family:'Orbitron',sans-serif;font-size:1.2rem;color:var(--primary);text-transform:uppercase;margin-bottom:20px;letter-spacing:1px}
.field{margin-bottom:18px}
.field label{display:block;font-size:.75rem;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:600}
.field input,.field textarea,.field select{width:100%;padding:12px 15px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#fff;font-family:'Montserrat',sans-serif;font-size:.95rem;outline:none;transition:.3s;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 12px var(--shadow)}
.field select option{background:#111;color:#fff}
.btn{padding:12px 25px;border-radius:8px;border:none;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;cursor:pointer;transition:.3s;letter-spacing:.5px}
.btn-primary{background:var(--primary);color:#000}
.btn-primary:hover{box-shadow:0 0 20px var(--shadow);transform:translateY(-2px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.08);color:#aaa}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.msg{margin-top:12px;font-size:.85rem;min-height:20px}
.tickets-title{font-family:'Orbitron',sans-serif;font-size:1.1rem;color:var(--primary);text-transform:uppercase;margin-bottom:20px;letter-spacing:1px}
.ticket-list{display:flex;flex-direction:column;gap:20px}
.ticket-card{background:rgba(20,20,20,0.6);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:25px;position:relative;overflow:hidden;transition:all .3s ease}
.ticket-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--primary);box-shadow:0 0 15px var(--shadow)}
.ticket-card.closed::before{background:#555;box-shadow:none;opacity:.5}
.ticket-card:hover{border-color:var(--border);box-shadow:0 5px 25px rgba(0,0,0,0.4)}
.ticket-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.ticket-title{font-family:'Orbitron',sans-serif;font-size:1.1rem;color:#fff;text-transform:uppercase;line-height:1.3;flex:1}
.ticket-status{font-size:.7rem;padding:4px 10px;border-radius:20px;font-weight:700;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.ticket-status.open{background:rgba(0,255,102,0.15);color:#00ff66}
.ticket-status.closed{background:rgba(255,255,255,0.08);color:#888}
.ticket-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;font-size:.75rem;color:#888}
.ticket-category{background:rgba(var(--primary-rgb),0.15);color:var(--primary);padding:3px 8px;border-radius:6px;font-weight:600}
.ticket-date{color:#888}
.ticket-author{color:#aaa}
.ticket-body{color:#bbb;font-size:.95rem;line-height:1.6;margin-bottom:15px;white-space:pre-wrap}
.ticket-comments{margin-top:15px;padding-top:15px;border-top:1px solid rgba(255,255,255,0.08)}
.ticket-comments-title{font-size:.8rem;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:600}
.comment{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:12px 15px;margin-bottom:10px}
.comment:last-child{margin-bottom:0}
.comment-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:5px}
.comment-author{font-size:.85rem;font-weight:700;color:var(--primary)}
.comment-date{font-size:.7rem;color:#888}
.comment-body{font-size:.9rem;color:#ccc;line-height:1.5;white-space:pre-wrap}
.comment-loading{text-align:center;color:#666;font-size:.85rem;padding:10px}
.loading{text-align:center;padding:60px 20px;color:#555}
.loading .spinner{display:inline-block;width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:#555}
.empty .icon{font-size:2.5rem;margin-bottom:10px}
.empty p{font-size:1rem}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){nav{padding:12px 15px}.container{padding:40px 15px}.form-card{padding:20px}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="particles" id="particles"></div>
<nav>
<a href="settings.html" class="back-btn">← Настройки</a>
<a href="settings.html" class="gear-link" title="Настройки">⚙</a>
</nav>
<div class="container">
<h1>Поддержка <span class="highlight">класса</span></h1>
<p class="subtitle">Нашли баг? Есть идея? Напишите нам!</p>
<div class="form-card">
<h2>📨 Новое обращение</h2>
<div class="field">
<label>Тема</label>
<input type="text" id="ticketTitle" placeholder="Кратко опишите проблему">
</div>
<div class="field">
<label>Категория</label>
<select id="ticketCategory">
<option value="🐛 Баг">🐛 Баг — что-то не работает</option>
<option value="💡 Идея">💡 Идея — предложение по улучшению</option>
<option value="❓ Вопрос">❓ Вопрос — нужен совет</option>
<option value="⚠️ Жалоба">⚠️ Жалоба — что-то не так</option>
</select>
</div>
<div class="field">
<label>Подробности</label>
<textarea id="ticketBody" rows="4" placeholder="Опишите подробно что произошло, на какой странице, что вы делали..."></textarea>
</div>
<button class="btn btn-primary" id="submitBtn" onclick="submitTicket()">📤 Отправить</button>
<div class="msg" id="formMsg"></div>
</div>
<h2 class="tickets-title">📋 Обращения и ответы</h2>
<div class="ticket-list" id="ticketList">
<div class="loading"><div class="spinner"></div><p>Загрузка обращений...</p></div>
</div>
</div>
<script src="settings.js"></script>
<script>
const REPO='6m-class/6m-class';
const API=`https://api.github.com/repos/${REPO}`;
const TOKEN=atob('Z2l0aHViX3BhdF8xMUIzS0lZT1EwWmFyUldtam9YWlJwX1QzcUNFaDdVa3FwWkFUd3phdWpsbTlFaDRLNE9ySEFqc09OblhUY24yUWNKR1hPVk9TVlgxRHpETGc5').trim();
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmt(d){return new Date(d).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
async function fetchT(url,opts={},ms=10000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{...opts,signal:c.signal}).finally(()=>clearTimeout(t))}

async function submitTicket(){
const t=document.getElementById('ticketTitle').value.trim();
const c=document.getElementById('ticketCategory').value;
const b=document.getElementById('ticketBody').value.trim();
if(!t||!b){document.getElementById('formMsg').textContent='❌ Заполни тему и подробности';document.getElementById('formMsg').style.color='#ff5555';return}
const btn=document.getElementById('submitBtn');
btn.disabled=true;btn.textContent='⏳ Отправка...';
document.getElementById('formMsg').textContent='';
try{
const body=`**Категория:** ${c}\n\n${b}\n\n---\n_Отправлено через страницу поддержки_`;
const r=await fetchT(`${API}/issues`,{
method:'POST',
headers:{
'Authorization':`Bearer ${TOKEN}`,
'Accept':'application/vnd.github+json',
'X-GitHub-Api-Version':'2022-11-28',
'Content-Type':'application/json'
},
body:JSON.stringify({
title:t,
body:body,
labels:['поддержка']
})
},15000);
if(!r.ok){const e=await r.json();throw new Error(e.message||'Ошибка '+r.status)}
const data=await r.json();
btn.disabled=false;btn.textContent='📤 Отправить';
document.getElementById('formMsg').textContent=`✅ Обращение отправлено! Номер #${data.number}`;
document.getElementById('formMsg').style.color='#00ff66';
document.getElementById('ticketTitle').value='';
document.getElementById('ticketBody').value='';
setTimeout(loadTickets,1000);
}catch(e){
btn.disabled=false;btn.textContent='📤 Отправить';
document.getElementById('formMsg').textContent='❌ Ошибка: '+e.message;
document.getElementById('formMsg').style.color='#ff5555';
}
}

async function loadTickets(){
const list=document.getElementById('ticketList');
try{
const r=await fetchT(`${API}/issues?labels=${encodeURIComponent('поддержка')}&state=all&sort=created&direction=desc&per_page=30&t=${Date.now()}`,{
cache:'no-store',
headers:{
'Authorization':`Bearer ${TOKEN}`,
'Accept':'application/vnd.github+json',
'X-GitHub-Api-Version':'2022-11-28'
}
});
if(!r.ok)throw new Error('API '+r.status);
const data=await r.json();
const tickets=Array.isArray(data)?data.filter(i=>!i.pull_request):[];
if(tickets.length===0){list.innerHTML='<div class="empty"><div class="icon">📭</div><p>Обращений пока нет.</p></div>';return}
list.innerHTML=tickets.map(t=>`
<div class="ticket-card${t.state==='closed'?' closed':''}" data-number="${t.number}">
<div class="ticket-header">
<div class="ticket-title">${esc(t.title)}</div>
<div class="ticket-status ${t.state}">${t.state==='open'?'Открыто':'Закрыто'}</div>
</div>
<div class="ticket-meta">
<span class="ticket-category">${esc((t.body||'').match(/\*\*Категория:\*\* (.+)/)?.[1]||'Обращение')}</span>
<span class="ticket-date">📅 ${fmt(t.created_at)}</span>
<span class="ticket-author">👤 ${esc(t.user.login)}</span>
<span style="color:#888">💬 ${t.comments} ответ(ов)</span>
</div>
<div class="ticket-body">${esc((t.body||'').replace(/\*\*Категория:\*\* .+\n\n/,'').replace(/\n---\n_Отправлено через страницу поддержки_/,''))}</div>
<div class="ticket-comments" id="comments-${t.number}" style="display:none">
<div class="ticket-comments-title">Ответы:</div>
<div class="comment-loading">Загрузка ответов...</div>
</div>
</div>
`).join('');
tickets.forEach(t=>{if(t.comments>0)loadComments(t.number)});
}catch(e){
list.innerHTML=`<div class="empty"><div class="icon">📡</div><p>Не удалось загрузить обращения.<br>Попробуйте обновить страницу.</p></div>`;
}
}

async function loadComments(num){
const el=document.getElementById('comments-'+num);
if(!el)return;
el.style.display='block';
try{
const r=await fetchT(`${API}/issues/${num}/comments?t=${Date.now()}`,{
cache:'no-store',
headers:{
'Authorization':`Bearer ${TOKEN}`,
'Accept':'application/vnd.github+json',
'X-GitHub-Api-Version':'2022-11-28'
}
});
if(!r.ok)throw new Error();
const comments=await r.json();
if(comments.length===0){el.innerHTML='<div class="ticket-comments-title">Ответы:</div><div class="comment-loading">Ответов пока нет.</div>';return}
el.innerHTML=`
<div class="ticket-comments-title">Ответы (${comments.length}):</div>
${comments.map(c=>`
<div class="comment">
<div class="comment-header">
<span class="comment-author">${esc(c.user.login)}</span>
<span class="comment-date">${fmt(c.created_at)}</span>
</div>
<div class="comment-body">${esc(c.body)}</div>
</div>
`).join('')}
`;
}catch(e){
el.innerHTML='<div class="ticket-comments-title">Ответы:</div><div class="comment-loading">Не удалось загрузить ответы.</div>';
}
}

// Particles
const isMobile=window.innerWidth<600;
const pc=document.getElementById('particles');
const count=isMobile?12:25;
for(let i=0;i<count;i++){
const p=document.createElement('div');p.classList.add('particle');
const s=Math.random()*3+1;
p.style.width=`${s}px`;p.style.height=`${s}px`;
p.style.left=`${Math.random()*100}vw`;
p.style.animationDuration=`${Math.random()*10+6}s`;
p.style.animationDelay=`${Math.random()*5}s`;
pc.appendChild(p);
}
loadTickets();
</script>
</body>
</html>
