<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поддержка | Самый лучший класс</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="settings.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden}
.bg-glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100vw;height:60vh;background:radial-gradient(ellipse at top,var(--glow),transparent 70%);z-index:-2;pointer-events:none}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.particle{position:absolute;background:var(--primary);border-radius:50%;box-shadow:0 0 5px var(--primary);animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:0.4}100%{transform:translateY(-10vh) scale(1);opacity:0}}
nav{padding:20px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(5,5,5,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.back-btn{color:#fff;text-decoration:none;font-weight:700;text-transform:uppercase;font-size:.9rem;padding:8px 20px;border:1px solid rgba(255,255,255,0.3);border-radius:4px;transition:.3s}
.back-btn:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 0 10px var(--shadow)}
.container{max-width:700px;margin:0 auto;padding:60px 20px 80px}
h1{font-family:'Orbitron',sans-serif;font-size:clamp(1.8rem,5vw,2.5rem);text-align:center;margin-bottom:10px;text-transform:uppercase;text-shadow:0 0 15px var(--glow-strong)}
.highlight{color:var(--primary)}
.subtitle{text-align:center;color:#888;margin-bottom:40px;font-size:1rem}
.card{background:rgba(20,20,20,0.6);border:1px solid var(--border);border-radius:12px;padding:30px;margin-bottom:20px}
.card-title{font-family:'Orbitron',sans-serif;font-size:1rem;color:var(--primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:20px}
.field{margin-bottom:18px}
.field label{display:block;font-size:.75rem;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:600}
.field input,.field textarea,.field select{width:100%;padding:12px 15px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-family:'Montserrat',sans-serif;font-size:.95rem;outline:none;transition:.3s;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 12px var(--shadow)}
.field select option{background:#111}
.btn{padding:14px 25px;border-radius:8px;border:none;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;cursor:pointer;transition:.3s;letter-spacing:.5px}
.btn-primary{background:var(--primary);color:#000}
.btn-primary:hover{box-shadow:0 0 20px var(--glow-strong);transform:translateY(-2px)}
.msg{margin-top:12px;font-size:.85rem;min-height:20px}
.ticket-list{display:flex;flex-direction:column;gap:12px}
.ticket{padding:18px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:10px;transition:.3s}
.ticket:hover{border-color:var(--border)}
.ticket-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.ticket-title{font-weight:700;font-size:1rem;flex:1}
.ticket-badge{font-size:.7rem;padding:4px 10px;border-radius:20px;font-weight:700;text-transform:uppercase;white-space:nowrap}
.ticket-badge.open{background:rgba(0,255,102,0.15);color:#00ff66}
.ticket-badge.closed{background:rgba(255,255,255,0.08);color:#666}
.ticket-meta{font-size:.75rem;color:#666;margin-bottom:8px}
.ticket-body{font-size:.9rem;color:#bbb;line-height:1.5}
.loading{text-align:center;padding:40px;color:#555}
.empty{text-align:center;padding:40px;color:#555}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="particles" id="particles"></div>
<nav>
    <a href="settings.html" class="back-btn">&#8592; К настройкам</a>
    <a href="index.html" class="back-btn">&#8592; На главную</a>
</nav>
<div class="container">
    <h1>Поддержка <span class="highlight">сайта</span></h1>
    <p class="subtitle">Нашли ошибку или есть идея? Напишите нам!</p>

    <div class="card">
        <div class="card-title">Новое обращение</div>
        <div class="field">
            <label>Тема</label>
            <input type="text" id="supSubject" placeholder="Кратко опишите проблему">
        </div>
        <div class="field">
            <label>Категория</label>
            <select id="supCategory">
                <option value="Баг">&#128027; Баг / ошибка</option>
                <option value="Идея">&#128161; Идея / предложение</option>
                <option value="Вопрос">&#10067; Вопрос</option>
                <option value="Жалоба">&#9888; Жалоба</option>
            </select>
        </div>
        <div class="field">
            <label>Подробности</label>
            <textarea id="supBody" rows="4" placeholder="Опишите подробнее..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="submitTicket()">&#128172; Отправить</button>
        <div class="msg" id="supMsg"></div>
    </div>

    <div class="card">
        <div class="card-title">История обращений</div>
        <div id="ticketList" class="ticket-list"><div class="loading">Загрузка...</div></div>
    </div>
</div>

<script>
const REPO='6m-class/6m-class';
const API='https://api.github.com/repos/'+REPO;

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

function fetchWithTimeout(url,opts={},ms=8000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{...opts,signal:c.signal}).finally(()=>clearTimeout(t));}

// Частицы
const pc=document.getElementById('particles');
for(let i=0;i<20;i++){const p=document.createElement('div');p.classList.add('particle');const s=Math.random()*3+1;p.style.width=s+'px';p.style.height=s+'px';p.style.left=Math.random()*100+'vw';p.style.animationDuration=(Math.random()*10+6)+'s';p.style.animationDelay=Math.random()*5+'s';pc.appendChild(p);}

function submitTicket(){
    const subj=document.getElementById('supSubject').value.trim();
    const cat=document.getElementById('supCategory').value;
    const body=document.getElementById('supBody').value.trim();
    if(!subj){document.getElementById('supMsg').textContent='\u274c Введите тему';document.getElementById('supMsg').style.color='#ff5555';return;}
    if(!body){document.getElementById('supMsg').textContent='\u274c Опишите подробности';document.getElementById('supMsg').style.color='#ff5555';return;}

    const title='['+cat+'] '+subj;
    const fullBody=body+'\n\n---\n\u041a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f: '+cat;
    const issueUrl=API+'/issues?labels='+encodeURIComponent('\u043f\u043e\u0434\u0434\u0435\u0440\u0436\u043a\u0430');

    // Пробуем через API (нужен токен) — если нет, открываем GitHub
    const token=localStorage.getItem('gh_token');
    if(token){
        document.getElementById('supMsg').textContent='\u23f3 Отправка...';
        document.getElementById('supMsg').style.color='#aaa';
        fetchWithTimeout(API+'/issues',{method:'POST',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({title:title,body:fullBody,labels:['\u043f\u043e\u0434\u0434\u0435\u0440\u0436\u043a\u0430',cat]})})
        .then(r=>{if(!r.ok)throw new Error('API '+r.status);return r.json();})
        .then(d=>{
            document.getElementById('supSubject').value='';
            document.getElementById('supBody').value='';
            document.getElementById('supMsg').textContent='\u2705 Обращение отправлено!';
            document.getElementById('supMsg').style.color='#00ff66';
            loadTickets();
        })
        .catch(e=>{
            // Фолбэк: открываем GitHub
            const ghUrl='https://github.com/'+REPO+'/issues/new?labels='+encodeURIComponent('\u043f\u043e\u0434\u0434\u0435\u0440\u0436\u043a\u0430')+'&title='+encodeURIComponent(title)+'&body='+encodeURIComponent(fullBody);
            window.open(ghUrl,'_blank');
            document.getElementById('supMsg').textContent='\u2705 Откройте GitHub и нажмите "Submit new issue"';
            document.getElementById('supMsg').style.color='#00ff66';
        });
    } else {
        const ghUrl='https://github.com/'+REPO+'/issues/new?labels='+encodeURIComponent('\u043f\u043e\u0434\u0434\u0435\u0440\u0436\u0430')+'&title='+encodeURIComponent(title)+'&body='+encodeURIComponent(fullBody);
        window.open(ghUrl,'_blank');
        document.getElementById('supMsg').textContent='\u2705 Откройте GitHub и нажмите "Submit new issue"';
        document.getElementById('supMsg').style.color='#00ff66';
    }
}

async function loadTickets(){
    const list=document.getElementById('ticketList');
    try{
        const r=await fetchWithTimeout(API+'/issues?labels='+encodeURIComponent('\u043f\u043e\u0434\u0434\u0435\u0440\u0436\u043a\u0430')+'&state=all&sort=created&direction=desc&per_page=20&t='+Date.now(),{cache:'no-store'},8000);
        if(!r.ok)throw new Error(r.status);
        const data=await r.json();
        const tickets=Array.isArray(data)?data.filter(i=>!i.pull_request):[];
        if(tickets.length===0){list.innerHTML='<div class="empty">Обращений пока нет.</div>';return;}
        list.innerHTML=tickets.map(t=>`
            <div class="ticket">
                <div class="ticket-head">
                    <div class="ticket-title">${esc(t.title)}</div>
                    <div class="ticket-badge ${t.state==='open'?'open':'closed'}">${t.state==='open'?'Открыто':'Закрыто'}</div>
                </div>
                <div class="ticket-meta">${new Date(t.created_at).toLocaleDateString('ru-RU')} \u00b7 ${esc(t.user.login)}</div>
                <div class="ticket-body">${esc((t.body||'').split('---')[0].trim())}</div>
            </div>
        `).join('');
    }catch(e){
        list.innerHTML='<div class="empty">Не удалось загрузить обращения.<br>Попробуйте обновить страницу.</div>';
    }
}

loadTickets();
</script>
</body>
</html>
