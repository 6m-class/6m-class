<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настройки | Самый лучший класс</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="settings.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden}
.bg-glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100vw;height:60vh;background:radial-gradient(ellipse at top,var(--glow),transparent 70%);z-index:-2;pointer-events:none}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.particle{position:absolute;background:var(--primary);border-radius:50%;box-shadow:0 0 5px var(--primary);animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:0.4}100%{transform:translateY(-10vh) scale(1);opacity:0}}
nav{padding:20px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(5,5,5,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.back-btn{color:#fff;text-decoration:none;font-weight:700;text-transform:uppercase;font-size:.9rem;padding:8px 20px;border:1px solid rgba(255,255,255,0.3);border-radius:4px;transition:.3s}
.back-btn:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 0 10px var(--shadow)}
.container{max-width:600px;margin:0 auto;padding:60px 20px 80px}
h1{font-family:'Orbitron',sans-serif;font-size:clamp(1.8rem,5vw,2.5rem);text-align:center;margin-bottom:10px;text-transform:uppercase;text-shadow:0 0 15px var(--glow-strong)}
.highlight{color:var(--primary)}
.subtitle{text-align:center;color:#888;margin-bottom:40px;font-size:1rem}
.card{background:rgba(20,20,20,0.6);border:1px solid var(--border);border-radius:12px;padding:30px;margin-bottom:20px}
.card-title{font-family:'Orbitron',sans-serif;font-size:1rem;color:var(--primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:20px}
.color-grid{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:10px}
.color-btn{width:50px;height:50px;border-radius:12px;border:2px solid rgba(255,255,255,0.15);cursor:pointer;transition:.3s;position:relative}
.color-btn:hover{transform:scale(1.1)}
.color-btn.active{border-color:#fff;box-shadow:0 0 20px currentColor;transform:scale(1.1)}
.color-btn[data-theme-val="red"]{background:#ff0033;color:#ff0033}
.color-btn[data-theme-val="yellow"]{background:#ffcc00;color:#ffcc00}
.color-btn[data-theme-val="green"]{background:#00ff66;color:#00ff66}
.color-btn[data-theme-val="blue"]{background:#00aaff;color:#00aaff}
.color-btn[data-theme-val="purple"]{background:#aa00ff;color:#aa00ff}
.color-btn .check{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;opacity:0;font-weight:900}
.color-btn.active .check{opacity:1}
.color-label{font-size:.75rem;color:#666;text-transform:uppercase;letter-spacing:1px;text-align:center;margin-top:5px}
.font-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:10px}
.font-btn{padding:18px 20px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:10px;cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:space-between}
.font-btn:hover{border-color:var(--border);background:rgba(255,255,255,0.05)}
.font-btn.active{border-color:var(--primary);box-shadow:0 0 15px var(--shadow)}
.font-name{font-size:1.1rem;font-weight:700}
.font-preview{font-size:1.2rem;color:#999}
.font-btn[data-font-val="normal"] .font-preview{font-family:'Montserrat',sans-serif}
.font-btn[data-font-val="bold"] .font-preview{font-family:'Montserrat',sans-serif;font-weight:700}
.font-btn[data-font-val="fancy"] .font-preview{font-family:'Miama Nueva',cursive}
.preview-box{margin-top:20px;padding:20px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px}
.preview-label{font-size:.7rem;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.preview-text{font-size:1.3rem;line-height:1.5}
.btn-row{display:flex;gap:12px;margin-top:25px}
.btn{flex:1;padding:14px;border-radius:8px;border:none;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;cursor:pointer;transition:.3s;letter-spacing:.5px}
.btn-primary{background:var(--primary);color:#000}
.btn-primary:hover{box-shadow:0 0 20px var(--glow-strong);transform:translateY(-2px)}
.btn-outline{background:transparent;border:1px solid var(--border);color:#aaa}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.support-card{background:rgba(20,20,20,0.6);border:1px solid var(--border);border-radius:12px;padding:25px;text-align:center}
.support-card h3{font-family:'Orbitron',sans-serif;font-size:.95rem;color:var(--primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.support-card p{color:#888;font-size:.85rem;line-height:1.6;margin-bottom:15px}
.support-link{display:inline-block;padding:10px 24px;border:1px solid var(--border);border-radius:8px;color:var(--primary);text-decoration:none;font-weight:700;font-size:.85rem;text-transform:uppercase;transition:.3s}
.support-link:hover{border-color:var(--primary);box-shadow:0 0 15px var(--shadow);background:rgba(255,255,255,0.03)}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="particles" id="particles"></div>
<nav>
    <a href="index.html" class="back-btn">&#8592; На главную</a>
</nav>
<div class="container">
    <h1>Настройки <span class="highlight">сайта</span></h1>
    <p class="subtitle">Персонализируйте внешний вид</p>

    <div class="card">
        <div class="card-title">Цвет</div>
        <div class="color-grid">
            <div class="color-btn" data-theme-val="red" onclick="selectColor('red')"><div class="check">&#10003;</div></div>
            <div class="color-btn" data-theme-val="yellow" onclick="selectColor('yellow')"><div class="check">&#10003;</div></div>
            <div class="color-btn" data-theme-val="green" onclick="selectColor('green')"><div class="check">&#10003;</div></div>
            <div class="color-btn" data-theme-val="blue" onclick="selectColor('blue')"><div class="check">&#10003;</div></div>
            <div class="color-btn" data-theme-val="purple" onclick="selectColor('purple')"><div class="check">&#10003;</div></div>
        </div>
        <div class="color-label" id="colorLabel">&#1086;&#1082;&#1088;&#1072;&#1089;&#1082;&#1072;</div>

        <div style="margin-top:25px" class="card-title">Шрифт</div>
        <div class="font-grid">
            <div class="font-btn" data-font-val="normal" onclick="selectFont('normal')">
                <div class="font-name">Обычный</div>
                <div class="font-preview">Аа Бб Вг</div>
            </div>
            <div class="font-btn" data-font-val="bold" onclick="selectFont('bold')">
                <div class="font-name">Жирный</div>
                <div class="font-preview">Аа Бб Вг</div>
            </div>
            <div class="font-btn" data-font-val="fancy" onclick="selectFont('fancy')">
                <div class="font-name">Красивый</div>
                <div class="font-preview">Аа Бб Вг</div>
            </div>
        </div>

        <div class="preview-box">
            <div class="preview-label">Предпросмотр</div>
            <div class="preview-text" id="previewText">Самый лучший в мире класс — это сказано про нас!</div>
        </div>

        <div class="btn-row">
            <button class="btn btn-outline" onclick="resetSettings()">Сбросить</button>
            <button class="btn btn-primary" onclick="location.href='index.html'">Готово</button>
        </div>
    </div>

    <div class="support-card">
        <h3>&#128172; Поддержка</h3>
        <p>Нашли ошибку или есть идея? Напишите нам!</p>
        <a href="support.html" class="support-link">Открыть поддержку</a>
    </div>
</div>

<script>
// Частицы
const pc=document.getElementById('particles');
for(let i=0;i<20;i++){const p=document.createElement('div');p.classList.add('particle');const s=Math.random()*3+1;p.style.width=s+'px';p.style.height=s+'px';p.style.left=Math.random()*100+'vw';p.style.animationDuration=(Math.random()*10+6)+'s';p.style.animationDelay=Math.random()*5+'s';pc.appendChild(p);}

// Текущие настройки
let curColor=localStorage.getItem('site-theme')||'red';
let curFont=localStorage.getItem('site-font')||'normal';

const colorNames={red:'Красный',yellow:'Жёлтый',green:'Зелёный',blue:'Синий',purple:'Фиолетовый'};
const fontNames={normal:'Обычный',bold:'Жирный',fancy:'Красивый'};

function selectColor(c){
    curColor=c;
    setSiteTheme(c);
    document.querySelectorAll('.color-btn').forEach(b=>b.classList.toggle('active',b.dataset.themeVal===c));
    document.getElementById('colorLabel').textContent=colorNames[c];
    updatePreview();
}
function selectFont(f){
    curFont=f;
    setSiteFont(f);
    document.querySelectorAll('.font-btn').forEach(b=>b.classList.toggle('active',b.dataset.fontVal===f));
    updatePreview();
}
function updatePreview(){
    const el=document.getElementById('previewText');
    el.setAttribute('data-font',curFont);
}
function resetSettings(){
    selectColor('red');
    selectFont('normal');
}

// Инициализация
selectColor(curColor);
selectFont(curFont);
</script>
</body>
</html>
