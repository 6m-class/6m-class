<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Внеурочные занятия | Самый лучший класс</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
/* === СИСТЕМА ТЕМ === */
:root { --primary:#ff0033; --glow:rgba(255,0,51,0.15); --glow-strong:rgba(255,0,51,0.8); --border:rgba(255,0,51,0.3); --shadow:rgba(255,0,51,0.2); }
[data-theme="blue"] { --primary:#00aaff; --glow:rgba(0,170,255,0.15); --glow-strong:rgba(0,170,255,0.8); --border:rgba(0,170,255,0.3); --shadow:rgba(0,170,255,0.2); }
[data-theme="green"] { --primary:#00ff66; --glow:rgba(0,255,102,0.15); --glow-strong:rgba(0,255,102,0.8); --border:rgba(0,255,102,0.3); --shadow:rgba(0,255,102,0.2); }
[data-theme="aero"] { --primary:#00ffff; --glow:rgba(0,255,255,0.15); --glow-strong:rgba(0,255,255,0.8); --border:rgba(0,255,255,0.3); --shadow:rgba(0,255,255,0.2); }

* { margin: 0; padding: 0; box-sizing: border-box; }
body { background-color: #050505; color: #ffffff; font-family: 'Montserrat', sans-serif; min-height: 100vh; position: relative; overflow-x: hidden; }

/* Переключатель тем */
.theme-switcher { position: fixed; top: 20px; left: 20px; z-index: 1000; display: flex; gap: 8px; }
.theme-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; transition: all 0.3s ease; opacity: 0.6; }
.theme-btn:hover, .theme-btn.active { opacity: 1; transform: scale(1.2); border-color: #fff; box-shadow: 0 0 10px currentColor; }
.theme-btn[data-set="red"] { background: #ff0033; color: #ff0033; }
.theme-btn[data-set="blue"] { background: #00aaff; color: #00aaff; }
.theme-btn[data-set="green"] { background: #00ff66; color: #00ff66; }
.theme-btn[data-set="aero"] { background: #00ffff; color: #00ffff; }

.background-glow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 0%, var(--glow) 0%, rgba(5,5,5,0) 60%); z-index: -2; pointer-events: none; }

/* Навигация БЕЗ логотипа */
nav {
    padding: 20px 40px; display: flex; justify-content: flex-end; align-items: center;
    background: rgba(5,5,5,0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
}
.back-btn {
    color: #fff; text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: 0.9rem;
    padding: 8px 20px; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; transition: 0.3s;
}
.back-btn:hover { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 10px var(--shadow); }

/* Контент */
.container { max-width: 1100px; margin: 0 auto; padding: 60px 20px; animation: fadeIn 1s ease-out; }
h1 {
    font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 5vw, 3rem);
    text-align: center; margin-bottom: 15px; text-transform: uppercase;
    text-shadow: 0 0 15px var(--glow-strong);
}
.highlight { color: var(--primary); }
.subtitle { text-align: center; color: #999; margin-bottom: 50px; font-size: 1rem; }

/* Сетка занятий */
.activities-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px;
}
.activity-card {
    background: rgba(20,20,20,0.6); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 25px; transition: all 0.3s ease;
    display: flex; flex-direction: column; position: relative; overflow: hidden;
}
.activity-card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
    background: var(--primary); transform: scaleX(0); transform-origin: left; transition: transform 0.4s ease;
}
.activity-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 10px 30px var(--shadow); }
.activity-card:hover::before { transform: scaleX(1); }

.activity-icon { font-size: 2.5rem; margin-bottom: 15px; }
.activity-title { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; color: #fff; margin-bottom: 10px; text-transform: uppercase; }
.activity-desc { color: #bbb; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; flex-grow: 1; }

.activity-info { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 15px; }
.activity-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.9rem; color: #999; }
.activity-row:last-child { margin-bottom: 0; }
.activity-row .label { color: var(--primary); font-weight: 700; min-width: 90px; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* Частицы */
.particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
.particle { position: absolute; background: var(--primary); border-radius: 50%; box-shadow: 0 0 5px var(--primary); animation: floatUp linear infinite; opacity: 0; }
@keyframes floatUp { 0%{transform:translateY(100vh) scale(0);opacity:0} 50%{opacity:0.5} 100%{transform:translateY(-10vh) scale(1);opacity:0} }
</style>
</head>
<body>
<div class="theme-switcher">
    <div class="theme-btn active" data-set="red" title="Красная"></div>
    <div class="theme-btn" data-set="blue" title="Синяя"></div>
    <div class="theme-btn" data-set="green" title="Зелёная"></div>
    <div class="theme-btn" data-set="aero" title="Аэро"></div>
</div>
<div class="background-glow"></div>
<div class="particles" id="particles"></div>

<nav>
    <a href="index.html" class="back-btn">← На главную</a>
</nav>

<div class="container">
    <h1>Внеурочные <span class="highlight">занятия</span></h1>
    <p class="subtitle">Расписание внеурочной деятельности нашего класса</p>

    <div class="activities-grid">




        <!-- Занятие 3 -->
        <div class="activity-card">
            <div class="activity-icon">Россия - мои горизонты</div>
            <div class="activity-title"></div>
            <div class="activity-desc">.</div>
            <div class="activity-info">
                <div class="activity-row"><span class="label">Когда:</span> чт 15:15 - 16:00 </div>
                <div class="activity-row"><span class="label">Кабинет:</span> 308</div>
                <div class="activity-row"><span class="label">Ведёт:</span>Карпетян Артур Арменович</div>
            </div>
        </div>


<script>
// Темы
const themeBtns = document.querySelectorAll('.theme-btn');
const savedTheme = localStorage.getItem('site-theme') || 'red';
document.documentElement.setAttribute('data-theme', savedTheme);
themeBtns.forEach(b => b.classList.toggle('active', b.dataset.set === savedTheme));
themeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        const theme = btn.dataset.set;
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('site-theme', theme);
        themeBtns.forEach(b => b.classList.toggle('active', b.dataset.set === theme));
    });
});

// Частицы
const pc = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
    const p = document.createElement('div'); p.classList.add('particle');
    const s = Math.random() * 4 + 1;
    p.style.width = `${s}px`; p.style.height = `${s}px`;
    p.style.left = `${Math.random() * 100}vw`;
    p.style.animationDuration = `${Math.random() * 10 + 5}s`;
    p.style.animationDelay = `${Math.random() * 5}s`;
    pc.appendChild(p);
}
</script>
<script>
// ===== ЧТЕНИЕ ВНЕУРОЧКИ ИЗ АДМИНКИ =====
(function() {
    // Тема
    const theme = localStorage.getItem('site-theme') || 'red';
    if (theme !== 'red') document.documentElement.setAttribute('data-theme', theme);

    // Внеурочка
    const activities = localStorage.getItem('siteActivities');
    if (activities) {
        const lines = activities.split('\n').filter(l => l.trim());
        // Ищем контейнер занятий
        const container = document.querySelector('.activities-grid') || document.querySelector('.activities-list') || document.querySelector('.container');
        if (container) {
            container.innerHTML = lines.map(l => `
                <div class="activity-item" style="background:rgba(20,20,20,0.6);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:15px;margin-bottom:10px;">
                    ${l}
                </div>
            `).join('');
        }
    }
})();
</script>
</body>
</html>
