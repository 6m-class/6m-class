<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Самый лучший класс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="settings.js"></script>
<link rel="preconnect" href="https://raw.githubusercontent.com">
<style>
:root{--primary:#ff0033;--primary-rgb:255,0,51;--bg:#0a0a0a;--card:#111;--border:rgba(255,255,255,0.08);--glow:rgba(255,0,51,0.15);--glow-strong:rgba(255,0,51,0.8);--shadow:rgba(255,0,51,0.2)}
[data-theme="yellow"]{--primary:#ffcc00;--primary-rgb:255,204,0;--glow:rgba(255,204,0,0.15);--glow-strong:rgba(255,204,0,0.8);--border:rgba(255,204,0,0.25);--shadow:rgba(255,204,0,0.2)}
[data-theme="green"]{--primary:#00ff66;--primary-rgb:0,255,102;--glow:rgba(0,255,102,0.15);--glow-strong:rgba(0,255,102,0.8);--border:rgba(0,255,102,0.25);--shadow:rgba(0,255,102,0.2)}
[data-theme="blue"]{--primary:#00aaff;--primary-rgb:0,170,255;--glow:rgba(0,170,255,0.15);--glow-strong:rgba(0,170,255,0.8);--border:rgba(0,170,255,0.25);--shadow:rgba(0,170,255,0.2)}
[data-theme="purple"]{--primary:#aa00ff;--primary-rgb:170,0,255;--glow:rgba(170,0,255,0.15);--glow-strong:rgba(170,0,255,0.8);--border:rgba(170,0,255,0.25);--shadow:rgba(170,0,255,0.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:'Montserrat',sans-serif;overflow-x:hidden;min-height:100vh;display:flex;justify-content:center;align-items:center;position:relative;padding:40px 20px}
.admin-link{position:fixed;top:20px;right:20px;z-index:1000;padding:8px 15px;background:rgba(0,0,0,0.6);border:1px solid var(--border);border-radius:5px;color:var(--primary);text-decoration:none;font-size:.8rem;font-weight:700;transition:.3s;backdrop-filter:blur(10px)}
.admin-link:hover{background:var(--primary);color:#000;box-shadow:0 0 15px var(--glow-strong)}
.gear-link{position:fixed;top:20px;right:140px;z-index:1000;padding:8px 15px;background:rgba(0,0,0,0.6);border:1px solid var(--border);border-radius:5px;color:#aaa;text-decoration:none;font-size:1rem;transition:.3s;backdrop-filter:blur(10px)}
.gear-link:hover{color:var(--primary);border-color:var(--primary);box-shadow:0 0 15px var(--shadow)}
.background-glow{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:80vw;height:80vw;background:radial-gradient(circle,var(--glow) 0%,rgba(10,10,10,0) 70%);z-index:-2;animation:pulseGlow 4s infinite alternate;pointer-events:none}
@keyframes pulseGlow{0%{transform:translate(-50%,-50%) scale(1);opacity:.8}100%{transform:translate(-50%,-50%) scale(1.2);opacity:1}}
.container{text-align:center;z-index:10;max-width:1000px;width:100%;display:flex;flex-direction:column;align-items:center}

.gate{position:fixed;inset:0;background:rgba(5,5,5,0.92);backdrop-filter:blur(12px);z-index:5000;display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .6s ease}
.gate.hidden{opacity:0;pointer-events:none}
.gate-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:35px 30px;max-width:420px;width:100%;text-align:center;box-shadow:0 0 60px rgba(var(--primary-rgb),0.15)}
.gate-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.gate-title{font-family:'Orbitron',sans-serif;font-size:1rem;color:var(--primary);text-transform:uppercase;letter-spacing:1px}
.card-badge{font-size:.7rem;padding:4px 10px;border-radius:20px;background:rgba(var(--primary-rgb),0.15);color:var(--primary);font-weight:700}
.gate-sub{color:#666;font-size:.85rem;margin-bottom:22px}
.captcha-box{display:flex;align-items:center;gap:15px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:left;transition:.3s;cursor:pointer}
.captcha-box:hover{border-color:rgba(var(--primary-rgb),0.4)}
.captcha-box.verified{border-color:var(--primary);box-shadow:0 0 20px var(--shadow)}
.captcha-check{width:30px;height:30px;border:2px solid var(--border);border-radius:6px;position:relative;flex-shrink:0;transition:.3s;background:rgba(0,0,0,0.3)}
.captcha-check:hover{border-color:var(--primary)}
.captcha-spinner{display:none;position:absolute;inset:2px;border:2px solid transparent;border-top-color:var(--primary);border-radius:50%;animation:capSpin .8s linear infinite}
.captcha-tick{display:none;position:absolute;inset:0;margin:auto;width:16px;height:16px;stroke:var(--primary);stroke-width:3;fill:none;filter:drop-shadow(0 0 5px var(--primary));animation:capPop .3s ease}
.captcha-box.checking .captcha-spinner{display:block}
.captcha-box.verified .captcha-tick{display:block}
.captcha-box.verified .captcha-check{border-color:var(--primary)}
.captcha-title{font-weight:700;font-size:.95rem}
.captcha-status{font-size:.75rem;color:#666;margin-top:2px;transition:.3s}
.captcha-box.verified .captcha-status{color:var(--primary)}
.captcha-logo{margin-left:auto;text-align:center;font-size:1.4rem;opacity:.6;display:flex;flex-direction:column;align-items:center;gap:2px}
.captcha-logo span{font-size:.55rem;color:#666;letter-spacing:1px;text-transform:uppercase}
@keyframes capSpin{to{transform:rotate(360deg)}}
@keyframes capPop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}

.typewriter-wrapper{display:flex;flex-direction:column;align-items:center;gap:15px;min-height:120px}
.typewriter-line{display:inline-block;font-size:clamp(1.2rem,3vw,2.5rem);font-weight:700;white-space:nowrap;overflow:hidden;width:0;border-right:3px solid transparent}
.animate .line-1{color:#fff;animation:typingLine1 2.5s steps(30,end) forwards,blinkCursor .75s step-end infinite 2.5s}
.animate .line-2{color:var(--primary);text-shadow:0 0 10px var(--shadow);animation:typingLine2 2s steps(25,end) 2.5s forwards,blinkCursorTheme .75s step-end infinite 4.5s}
.animate .line-3{color:#e0e0e0;font-size:clamp(1rem,2.5vw,2rem);animation:typingLine3 2s steps(35,end) 4.5s forwards;border-right:none}
.animate .btn{animation:fadeInUp 1s ease-out 6.5s forwards}
.animate .extra-sections{animation:fadeInUp 1s ease-out 7.5s forwards}
.no-animate .typewriter-line{width:100%;border-right:none}
.no-animate .line-1{color:#fff}
.no-animate .line-2{color:var(--primary);text-shadow:0 0 10px var(--shadow)}
.no-animate .line-3{color:#e0e0e0;font-size:clamp(1rem,2.5vw,2rem)}
.no-animate .btn{opacity:1;transform:translateY(0)}
.no-animate .extra-sections{opacity:1}
.btn{display:inline-block;margin-top:40px;padding:14px 38px;font-family:'Orbitron',sans-serif;font-size:1.05rem;font-weight:700;color:var(--primary);text-decoration:none;text-transform:uppercase;letter-spacing:.5px;border:1px solid var(--primary);border-radius:8px;background:transparent;cursor:pointer;transition:.3s;opacity:0;transform:translateY(20px);box-shadow:0 0 10px var(--shadow)}
.btn:hover{background:var(--primary);color:#000;box-shadow:0 0 25px var(--glow-strong);transform:scale(1.05)}
.extra-sections{margin-top:80px;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;opacity:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:25px;text-align:left;transition:.3s;display:flex;flex-direction:column}
.card:hover{border-color:rgba(var(--primary-rgb),0.4);box-shadow:0 0 25px var(--shadow);transform:translateY(-4px)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.card-title{font-family:'Orbitron',sans-serif;font-size:1rem;color:var(--primary);text-transform:uppercase;letter-spacing:1px}
.schedule-list{list-style:none;margin-bottom:18px;flex-grow:1}
.schedule-list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:.92rem;color:#ccc}
.schedule-list li:last-child{border-bottom:none}
.schedule-list li span:first-child{color:var(--primary);font-weight:700;min-width:24px}
.news-date{color:var(--primary);font-size:.75rem;font-weight:700;margin-bottom:4px;text-transform:uppercase}
.news-text{color:#ddd;font-size:.9rem;line-height:1.5}
.news-item{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.news-empty{color:#666;font-style:italic;padding:18px 0;text-align:center;flex-grow:1;font-size:.9rem}
.card-link{align-self:flex-start;color:#aaa;text-decoration:none;font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;transition:.3s;padding:8px 16px;border:1px solid var(--border);border-radius:6px;margin-top:auto}
.card-link:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 0 12px var(--shadow)}

.notif-bar{position:fixed;top:0;left:0;right:0;z-index:3000;background:rgba(17,17,17,0.97);border-bottom:2px solid var(--primary);padding:14px 50px 14px 20px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(12px);box-shadow:0 4px 20px var(--shadow);animation:slideDown .4s ease-out}
.notif-bar.hidden{transform:translateY(-100%);opacity:0;pointer-events:none}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.notif-icon{font-size:1.3rem;flex-shrink:0;filter:drop-shadow(0 0 5px var(--primary))}
.notif-content{flex:1;min-width:0}
.notif-title{font-weight:700;font-size:.95rem;color:#fff;word-wrap:break-word}
.notif-date{font-size:.7rem;color:#888;margin-top:2px}
.notif-close{position:absolute;top:50%;right:14px;transform:translateY(-50%);background:none;border:none;color:#888;cursor:pointer;font-size:1.3rem;transition:.3s;padding:4px 8px;line-height:1}
.notif-close:hover{color:var(--primary);transform:translateY(-50%) scale(1.2)}
@media(max-width:600px){.notif-bar{padding:12px 44px 12px 16px}.notif-title{font-size:.85rem}.gear-link{right:auto;left:20px}}

.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;pointer-events:none}
.particle{position:absolute;background:var(--primary);border-radius:50%;box-shadow:0 0 10px var(--primary);animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(-10vh) scale(1.5);opacity:0}}
@keyframes fadeInUp{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)}}
@keyframes typingLine1{from{width:0;border-right-color:#fff}to{width:100%;border-right-color:#fff}}
@keyframes typingLine2{from{width:0;border-right-color:var(--primary)}to{width:100%;border-right-color:var(--primary)}}
@keyframes typingLine3{from{width:0}to{width:100%}}
@keyframes blinkCursor{from,to{border-right-color:transparent}50%{border-right-color:#fff}}
@keyframes blinkCursorTheme{from,to{border-right-color:transparent}50%{border-right-color:var(--primary)}}
</style>
</head>
<body>
<a href="settings.html" class="gear-link" title="Настройки">⚙</a>
<a href="admin.html" class="admin-link">⚙️ Админ</a>
<div class="background-glow"></div>
<div class="particles" id="particles"></div>

<div class="gate" id="gate">
    <div class="gate-card">
        <div class="gate-head">
            <div class="gate-title">Проверка безопасности</div>
            <div class="card-badge"></div>
        </div>
        <p class="gate-sub">Подтвердите, что вы человек, чтобы войти на сайт</p>
        <div class="captcha-box" id="captchaBox" onclick="runCaptcha()">
            <div class="captcha-check">
                <div class="captcha-spinner"></div>
                <svg class="captcha-tick" viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg>
            </div>
            <div>
                <div class="captcha-title">Я не робот</div>
                <div class="captcha-status" id="captchaStatus">Нажмите, чтобы подтвердить</div>
            </div>
            <div class="captcha-logo"><span>Protect</span></div>
        </div>
    </div>
</div>

<div class="container" id="siteContainer">
    <div class="typewriter-wrapper">
        <div class="typewriter-line line-1" id="poemLine1">Загрузка...</div>
        <div class="typewriter-line line-2" id="poemLine2"></div>
        <div class="typewriter-line line-3" id="poemLine3"></div>
    </div>
    <a href="class.html" class="btn" id="mainBtn">Наши ученики</a>
    <div class="extra-sections">
        <div class="card">
            <div class="card-header"><div class="card-title">📅 Расписание</div><div class="card-badge" id="schedBadge">...</div></div>
            <ul class="schedule-list" id="scheduleList"><li><span>⏳</span> Загрузка...</li></ul>
            <a href="school.html" class="card-link">Полное расписание →</a>
        </div>
        <div class="card">
            <div class="card-header"><div class="card-title">📰 Новости</div><div class="card-badge" id="newsBadge">0</div></div>
            <div id="newsContent" style="flex-grow:1"><p class="news-empty">Загрузка...</p></div>
            <a href="news.html" class="card-link">Все новости →</a>
        </div>
        <div class="card">
            <div class="card-header"><div class="card-title">🎯 Внеурочка</div><div class="card-badge" id="actBadge">...</div></div>
            <ul class="schedule-list" id="activitiesList"><li><span>⏳</span> Загрузка...</li></ul>
            <a href="activites.html" class="card-link">Все занятия →</a>
        </div>
    </div>
</div>

<script>
const REPO = '6m-class/6m-class';
const container = document.getElementById('siteContainer');
const gate = document.getElementById('gate');

function startSite() {
    if (!sessionStorage.getItem('visitedMain')) {
        container.classList.add('animate');
        sessionStorage.setItem('visitedMain', 'true');
    } else {
        container.classList.add('no-animate');
    }
}
function openGate() {
    gate.classList.add('hidden');
    setTimeout(() => gate.remove(), 700);
    startSite();
}
if (localStorage.getItem('captchaPassed') === '1') {
    openGate();
}
function runCaptcha() {
    const box = document.getElementById('captchaBox');
    if (box.classList.contains('checking') || box.classList.contains('verified')) return;
    box.classList.add('checking');
    document.getElementById('captchaStatus').textContent = 'Проверяем...';
    setTimeout(() => {
        box.classList.remove('checking');
        box.classList.add('verified');
        document.getElementById('captchaStatus').textContent = 'Проверка пройдена — добро пожаловать ✅';
        localStorage.setItem('captchaPassed', '1');
        setTimeout(openGate, 600);
    }, 1500);
}

function showNotifPopup(title, dateStr) {
    const old = document.querySelector('.notif-bar');
    if (old) old.remove();
    const bar = document.createElement('div');
    bar.className = 'notif-bar';
    bar.innerHTML = '<span class="notif-icon">🔔</span><div class="notif-content"><div class="notif-title">'+escapeHtml(title)+'</div><div class="notif-date">'+dateStr+'</div></div><button class="notif-close" onclick="closeNotif()">✕</button>';
    document.body.appendChild(bar);
}
function closeNotif() {
    const bar = document.querySelector('.notif-bar');
    if (bar) {
        bar.style.transition = 'transform .3s ease, opacity .3s ease';
        bar.style.transform = 'translateY(-100%)';
        bar.style.opacity = '0';
        setTimeout(() => bar.remove(), 300);
    }
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function getCached(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch(e) { return null; } }
function setCached(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

async function loadDataJson() {
    const urls = [
        'data.json?v='+Date.now(),
        'https://raw.githubusercontent.com/'+REPO+'/main/data.json?v='+Date.now(),
        'https://raw.githubusercontent.com/'+REPO+'/master/data.json?v='+Date.now(),
        'https://cdn.jsdelivr.net/gh/'+REPO+'@main/data.json?v='+Date.now()
    ];
    for (const url of urls) {
        try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 8000);
            const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
            clearTimeout(timeout);
            if (res.ok) return await res.json();
        } catch(e) { continue; }
    }
    const cached = getCached('site_data_cache');
    if (cached) return cached.data;
    return null;
}

async function loadIssues(label, cacheKey) {
    const cached = getCached(cacheKey);
    const now = Date.now();
    if (cached && (now - cached.ts) < 600000) return cached.data;
    try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);
        const res = await fetch(
            'https://api.github.com/repos/'+REPO+'/issues?labels='+encodeURIComponent(label)+'&state=open&sort=created&direction=desc&per_page=10&t='+Date.now(),
            { cache: 'no-store', signal: controller.signal }
        );
        clearTimeout(timeout);
        if (!res.ok) throw new Error('API ' + res.status);
        const data = await res.json();
        setCached(cacheKey, { data, ts: now });
        return data;
    } catch(e) {
        if (cached) return cached.data;
        return [];
    }
}

function renderData(data) {
    if (!data) {
        document.getElementById('poemLine1').textContent = 'Самый лучший в мире класс';
        document.getElementById('poemLine2').textContent = 'это сказано про нас';
        document.getElementById('poemLine3').textContent = 'Мы, внуки Пифагора!';
        return;
    }
    setCached('site_data_cache', { data, ts: Date.now() });
    if (data.poem_line1) document.getElementById('poemLine1').textContent = data.poem_line1;
    if (data.poem_line2) document.getElementById('poemLine2').textContent = data.poem_line2;
    if (data.poem_line3) document.getElementById('poemLine3').textContent = data.poem_line3;
    if (data.btn_text) document.getElementById('mainBtn').textContent = data.btn_text;
    if (data.btn_link) document.getElementById('mainBtn').href = data.btn_link;

    const sched = (data.schedule || '').split('\n').filter(l => l.trim());
    document.getElementById('schedBadge').textContent = sched.length + ' уроков';
    document.getElementById('scheduleList').innerHTML = sched.length
        ? sched.map(l => '<li><span>•</span> '+escapeHtml(l.trim())+'</li>').join('')
        : '<li style="color:#777"><span>—</span> Расписание не заполнено</li>';

    const act = (data.activities || '').split('\n').filter(l => l.trim());
    document.getElementById('actBadge').textContent = act.length + ' занят.';
    document.getElementById('activitiesList').innerHTML = act.length
        ? act.map(l => '<li><span>•</span> '+escapeHtml(l.trim())+'</li>').join('')
        : '<li style="color:#777"><span>—</span> Нет занятий</li>';
}

function renderNews(news, data) {
    document.getElementById('newsBadge').textContent = Array.isArray(news) ? news.length : 0;
    const nc = document.getElementById('newsContent');
    if (Array.isArray(news) && news.length > 0) {
        nc.innerHTML = news.map(n =>
            '<div class="news-item"><div class="news-date">'+new Date(n.created_at).toLocaleDateString('ru-RU')+'</div><div class="news-text"><b>'+escapeHtml(n.title)+'</b><br>'+escapeHtml(n.body || '')+'</div></div>'
        ).join('');
    } else {
        nc.innerHTML = '<p class="news-empty">'+escapeHtml(data?.news_empty || 'Упс... Тут пока что ничего нету.')+'</p>';
    }
}

function renderNotifs(notifs) {
    if (Array.isArray(notifs) && notifs.length > 0) {
        const last = notifs[0];
        showNotifPopup(last.title, new Date(last.created_at).toLocaleString('ru-RU'));
    }
}

let currentData = null;
async function loadSite() {
    try {
        const [dataResult, newsResult, notifResult] = await Promise.allSettled([
            loadDataJson(),
            loadIssues('новость', 'news_cache'),
            loadIssues('уведомление', 'notif_cache')
        ]);
        const data = dataResult.status === 'fulfilled' ? dataResult.value : null;
        const news = newsResult.status === 'fulfilled' ? newsResult.value : [];
        const notifs = notifResult.status === 'fulfilled' ? notifResult.value : [];
        if (data) currentData = data;
        renderData(currentData);
        renderNews(news, currentData);
        renderNotifs(notifs);
    } catch(err) {
        console.error('Ошибка:', err);
        if (currentData) {
            renderData(currentData);
        } else {
            document.getElementById('poemLine1').textContent = 'Самый лучший в мире класс';
            document.getElementById('poemLine2').textContent = 'это сказано про нас';
            document.getElementById('poemLine3').textContent = 'Мы, внуки Пифагора!';
        }
    }
}

loadSite();
setInterval(loadSite, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadSite(); });

const isMobile = window.innerWidth < 600;
const pc = document.getElementById('particles');
const count = isMobile ? 20 : 50;
for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.classList.add('particle');
    const s = Math.random() * 5 + 2;
    p.style.width = s + 'px'; p.style.height = s + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = Math.random() * 5 + 3 + 's';
    p.style.animationDelay = Math.random() * 5 + 's';
    pc.appendChild(p);
}
</script>
</body>
</html>
