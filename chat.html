<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чат | Самый лучший класс</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#ff0033;--primary-rgb:255,0,51;--glow:rgba(255,0,51,0.15);--glow-strong:rgba(255,0,51,0.8);--border:rgba(255,0,51,0.3);--shadow:rgba(255,0,51,0.2)}
[data-theme="yellow"]{--primary:#ffcc00;--primary-rgb:255,204,0;--glow:rgba(255,204,0,0.15);--glow-strong:rgba(255,204,0,0.8);--border:rgba(255,204,0,0.3);--shadow:rgba(255,204,0,0.2)}
[data-theme="green"]{--primary:#00ff66;--primary-rgb:0,255,102;--glow:rgba(0,255,102,0.15);--glow-strong:rgba(0,255,102,0.8);--border:rgba(0,255,102,0.3);--shadow:rgba(0,255,102,0.2)}
[data-theme="blue"]{--primary:#00aaff;--primary-rgb:0,170,255;--glow:rgba(0,170,255,0.15);--glow-strong:rgba(0,170,255,0.8);--border:rgba(0,170,255,0.3);--shadow:rgba(0,170,255,0.2)}
[data-theme="purple"]{--primary:#aa00ff;--primary-rgb:170,0,255;--glow:rgba(170,0,255,0.15);--glow-strong:rgba(170,0,255,0.8);--border:rgba(170,0,255,0.3);--shadow:rgba(170,0,255,0.2)}
[data-theme="aero"]{--primary:#00ffff;--primary-rgb:0,255,255;--glow:rgba(0,255,255,0.15);--glow-strong:rgba(0,255,255,0.8);--border:rgba(0,255,255,0.3);--shadow:rgba(0,255,255,0.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden}
.bg-glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100vw;height:50vh;background:radial-gradient(ellipse at top,var(--glow),transparent 70%);z-index:-2;pointer-events:none}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.particle{position:absolute;background:var(--primary);border-radius:50%;box-shadow:0 0 5px var(--primary);animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:0.4}100%{transform:translateY(-10vh) scale(1);opacity:0}}
nav{padding:15px 30px;display:flex;justify-content:space-between;align-items:center;background:rgba(5,5,5,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.back-btn{color:#fff;text-decoration:none;font-weight:700;text-transform:uppercase;font-size:.9rem;padding:8px 20px;border:1px solid rgba(255,255,255,0.3);border-radius:4px;transition:.3s;cursor:pointer}
.back-btn:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 0 10px var(--shadow)}
.nav-right{display:flex;gap:10px;align-items:center}
.user-badge{font-size:.8rem;color:#888}
.highlight{color:var(--primary)}
.chat-wrap{max-width:800px;margin:0 auto;padding:15px;height:calc(100vh - 120px);display:flex;flex-direction:column}
.chat-header{text-align:center;margin-bottom:10px}
.chat-header h1{font-family:'Orbitron',sans-serif;font-size:1.4rem;text-transform:uppercase}
.chat-messages{flex:1;overflow-y:auto;padding:20px;background:rgba(20,20,20,0.6);border:1px solid var(--border);border-radius:12px;margin-bottom:12px}
.chat-message{display:flex;gap:10px;margin-bottom:15px;align-items:flex-start}
.chat-message.me{flex-direction:row-reverse}
.chat-avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;flex-shrink:0;font-size:1rem}
.chat-message.me .chat-avatar{background:rgba(255,255,255,0.15);color:#fff}
.chat-bubble{max-width:70%}
.chat-message.me .chat-bubble{display:flex;flex-direction:column;align-items:flex-end}
.chat-name{font-size:.8rem;font-weight:700;color:var(--primary);margin-bottom:3px}
.chat-message.me .chat-name{color:#aaa}
.chat-text{color:#ccc;font-size:.95rem;line-height:1.5;word-wrap:break-word;word-break:break-word;background:rgba(255,255,255,0.03);padding:10px 14px;border-radius:10px;border-top-left-radius:2px}
.chat-message.me .chat-text{background:rgba(var(--primary-rgb),0.1);border-top-left-radius:10px;border-top-right-radius:2px}
.chat-time{font-size:.65rem;color:#555;margin-top:3px}
.chat-input-area{display:flex;gap:10px}
.chat-input-area input{flex:1;padding:14px 18px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;color:#fff;font-size:.95rem;outline:none;transition:.3s;font-family:'Montserrat',sans-serif}
.chat-input-area input:focus{border-color:var(--primary);box-shadow:0 0 12px var(--shadow)}
.chat-input-area button{padding:14px 22px;background:var(--primary);border:none;border-radius:8px;color:#000;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;cursor:pointer;transition:.3s;white-space:nowrap}
.chat-input-area button:hover{box-shadow:0 0 20px var(--shadow)}
.chat-input-area button:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;color:#555;padding:40px 20px}
.empty .icon{font-size:2.5rem;margin-bottom:10px}
@media(max-width:600px){nav{padding:12px 15px}.chat-wrap{padding:12px;height:calc(100vh - 100px)}.chat-bubble{max-width:82%}.nav-right .user-badge{display:none}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="particles" id="particles"></div>
<nav>
<a href="index.html" class="back-btn">&#8592; На главную</a>
<div class="nav-right">
<span class="user-badge" id="userInfo"></span>
<span class="back-btn" id="logoutBtn" style="cursor:pointer">Выйти</span>
</div>
</nav>
<div class="chat-wrap">
<div class="chat-header"><h1>Чат <span class="highlight">класса</span></h1></div>
<div class="chat-messages" id="chatMessages"><div class="empty">Загрузка...</div></div>
<div class="chat-input-area">
<input type="text" id="chatInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter')sendMessage()" maxlength="500">
<button id="sendBtn" onclick="sendMessage()">📤</button>
</div>
</div>
<script src="settings.js"></script>
<script>
const session=JSON.parse(localStorage.getItem('session_user')||'null');
if(!session){window.location.href='login.html';}
document.getElementById('userInfo').textContent='\u00A4 '+session.name;

const REPO='6m-class/6m-class';
const API=`https://api.github.com/repos/${REPO}`;
const TOKEN=['github_pat_','11B3KIYOQ0ilb','1Ra5wQE8C_CU0h1','HfozZmBCjSExmL4j','NQhPc5muD9hP8DChF','2GW634H7CUFQRjbl','WWLpn'].join('');

let chatIssueNum=null;
let lastCommentId=0;
let pollTimer=null;

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

async function initChat(){
try{
const res=await fetch(`${API}/issues?labels=${encodeURIComponent('\u0447\u0430\u0442')}&state=open&per_page=1&t=${Date.now()}`,{
headers:{'Authorization':`Bearer ${TOKEN}`,'Accept':'application/vnd.github+json'}
});
if(!res.ok)throw new Error('API error '+res.status);
const issues=await res.json();
const chatIssues=issues.filter(i=>!i.pull_request);
if(chatIssues.length>0){
chatIssueNum=chatIssues[0].number;
}else{
const createRes=await fetch(`${API}/issues`,{
method:'POST',
headers:{'Authorization':`Bearer ${TOKEN}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
body:JSON.stringify({title:'\u0427\u0430\u0442 \u043a\u043b\u0430\u0441\u0441\u0430 6\u041c',body:'\u041e\u0431\u0449\u0438\u0439 \u0447\u0430\u0442 \u043a\u043b\u0430\u0441\u0441\u0430. \u0421\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f \u0447\u0435\u0440\u0435\u0437 \u0441\u0430\u0439\u0442.',labels:['\u0447\u0430\u0442']})
});
if(!createRes.ok)throw new Error('Не удалось создать чат');
const newIssue=await createRes.json();
chatIssueNum=newIssue.number;
}
loadMessages();
pollTimer=setInterval(loadMessages,5000);
}catch(e){
document.getElementById('chatMessages').innerHTML=`<div class="empty" style="color:#ff5555">❌ ${e.message}</div>`;
}
}

async function loadMessages(){
if(!chatIssueNum)return;
try{
const res=await fetch(`${API}/issues/${chatIssueNum}/comments?per_page=100&t=${Date.now()}`,{
headers:{'Authorization':`Bearer ${TOKEN}`,'Accept':'application/vnd.github+json'}
});
if(!res.ok)throw new Error();
const comments=await res.json();
const container=document.getElementById('chatMessages');
if(comments.length===0){
if(lastCommentId===0){container.innerHTML='<div class="empty"><div class="icon">💬</div><p>Сообщений пока нет. Напишите первым!</p></div>';}
return;
}
const newestId=comments[comments.length-1].id;
if(newestId===lastCommentId&&container.querySelector('.chat-message'))return;
lastCommentId=newestId;
const wasAtBottom=container.scrollTop+container.clientHeight>=container.scrollHeight-50;
container.innerHTML=comments.map(c=>{
let name='Аноним',text=c.body,login='';
try{const p=JSON.parse(c.body);name=p.n||'Аноним';text=p.t||'';login=p.l||'';}catch(e){}
const isMe=session.login===login;
const initial=(name||'?').charAt(0).toUpperCase();
const time=new Date(c.created_at).toLocaleString('ru-RU',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
return `<div class="chat-message${isMe?' me':''}"><div class="chat-avatar">${initial}</div><div class="chat-bubble"><div class="chat-name">${esc(name)}</div><div class="chat-text">${esc(text)}</div><div class="chat-time">${time}</div></div></div>`;
}).join('');
if(wasAtBottom)container.scrollTop=container.scrollHeight;
}catch(e){}
}

async function sendMessage(){
const input=document.getElementById('chatInput');
const text=input.value.trim();
if(!text||!chatIssueNum)return;
const btn=document.getElementById('sendBtn');
btn.disabled=true;
input.value='';
try{
const body=JSON.stringify({n:session.name,t:text,l:session.login});
const res=await fetch(`${API}/issues/${chatIssueNum}/comments`,{
method:'POST',
headers:{'Authorization':`Bearer ${TOKEN}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
body:JSON.stringify({body:body})
});
if(!res.ok)throw new Error('Не удалось отправить');
await loadMessages();
}catch(e){
input.value=text;
alert('❌ '+e.message);
}finally{
btn.disabled=false;
}
}

document.getElementById('logoutBtn').addEventListener('click',e=>{
e.preventDefault();
localStorage.removeItem('session_user');
window.location.href='login.html';
});

// Particles
const isMobile=window.innerWidth<600;
const pc=document.getElementById('particles');
const count=isMobile?10:20;
for(let i=0;i<count;i++){
const p=document.createElement('div');p.classList.add('particle');
const s=Math.random()*3+1;
p.style.width=`${s}px`;p.style.height=`${s}px`;
p.style.left=`${Math.random()*100}vw`;
p.style.animationDuration=`${Math.random()*10+6}s`;
p.style.animationDelay=`${Math.random()*5}s`;
pc.appendChild(p);
}

initChat();
</script>
</body>
</html>
