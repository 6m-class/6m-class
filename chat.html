<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чат | Самый лучший класс</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="settings.js"></script>
<style>
:root{--primary:#ff0033;--primary-rgb:255,0,51;--glow:rgba(255,0,51,0.15);--glow-strong:rgba(255,0,51,0.8);--border:rgba(255,0,51,0.3);--shadow:rgba(255,0,51,0.2)}
[data-theme="yellow"]{--primary:#ffcc00;--primary-rgb:255,204,0;--glow:rgba(255,204,0,0.15);--glow-strong:rgba(255,204,0,0.8);--border:rgba(255,204,0,0.3);--shadow:rgba(255,204,0,0.2)}
[data-theme="green"]{--primary:#00ff66;--primary-rgb:0,255,102;--glow:rgba(0,255,102,0.15);--glow-strong:rgba(0,255,102,0.8);--border:rgba(0,255,102,0.3);--shadow:rgba(0,255,102,0.2)}
[data-theme="blue"]{--primary:#00aaff;--primary-rgb:0,170,255;--glow:rgba(0,170,255,0.15);--glow-strong:rgba(0,170,255,0.8);--border:rgba(0,170,255,0.3);--shadow:rgba(0,170,255,0.2)}
[data-theme="purple"]{--primary:#aa00ff;--primary-rgb:170,0,255;--glow:rgba(170,0,255,0.15);--glow-strong:rgba(170,0,255,0.8);--border:rgba(170,0,255,0.3);--shadow:rgba(170,0,255,0.2)}
[data-theme="aero"]{--primary:#00ffff;--primary-rgb:0,255,255;--glow:rgba(0,255,255,0.15);--glow-strong:rgba(0,255,255,0.8);--border:rgba(0,255,255,0.3);--shadow:rgba(0,255,255,0.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;height:100vh}
.bg-glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100vw;height:40vh;background:radial-gradient(ellipse at top,var(--glow),transparent 70%);z-index:-2;pointer-events:none}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.particle{position:absolute;background:var(--primary);border-radius:50%;box-shadow:0 0 5px var(--primary);animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:0.4}100%{transform:translateY(-10vh) scale(1);opacity:0}}
nav{padding:12px 20px;display:flex;justify-content:space-between;align-items:center;background:rgba(5,5,5,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);flex-shrink:0}
.nav-left{display:flex;gap:10px;align-items:center}
.back-btn{color:#fff;text-decoration:none;font-weight:700;text-transform:uppercase;font-size:.85rem;padding:8px 16px;border:1px solid rgba(255,255,255,0.3);border-radius:4px;transition:.3s}
.back-btn:hover{border-color:var(--primary);color:var(--primary)}
.nav-btn{color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;padding:8px 16px;border:1px solid rgba(255,255,255,0.3);border-radius:4px;transition:.3s;cursor:pointer}
.nav-btn:hover{border-color:var(--primary);color:var(--primary)}
.logout-btn{padding:8px 16px;border:1px solid rgba(255,80,80,0.3);border-radius:4px;background:transparent;color:#ff5555;font-size:.85rem;cursor:pointer;transition:.3s;font-family:'Montserrat',sans-serif;font-weight:700}
.logout-btn:hover{background:rgba(255,80,80,0.1);border-color:#ff5555}
.nav-right{display:flex;gap:10px;align-items:center}
.nav-avatar{width:32px;height:32px;border-radius:50%;border:2px solid var(--primary);object-fit:cover;background:rgba(var(--primary-rgb),0.1)}
.nav-avatar-ph{width:32px;height:32px;border-radius:50%;border:2px solid var(--primary);background:rgba(var(--primary-rgb),0.1);display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;color:var(--primary)}
.user-badge{font-size:.85rem;color:#aaa;display:flex;align-items:center;gap:6px}
.user-badge b{color:var(--primary)}
.chat-title{font-family:'Orbitron',sans-serif;font-size:1.1rem;text-transform:uppercase;text-align:center;flex-shrink:0;padding:8px}
.chat-title span{color:var(--primary)}
#chatBox{flex:1;overflow-y:auto;padding:15px 20px;display:flex;flex-direction:column;gap:10px}
.pinned-section{background:rgba(var(--primary-rgb),0.08);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.pinned-header{font-size:.75rem;color:var(--primary);font-weight:700;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:4px}
.pinned-msg{display:flex;gap:8px;align-items:flex-start;padding:8px;background:rgba(255,255,255,0.04);border-radius:8px;margin-bottom:6px}
.pinned-msg:last-child{margin-bottom:0}
.pinned-avatar{width:28px;height:28px;border-radius:50%;border:2px solid var(--primary);object-fit:cover;flex-shrink:0;background:rgba(var(--primary-rgb),0.1);cursor:pointer;transition:.2s}
.pinned-avatar:hover{opacity:.8;transform:scale(1.1)}
.pinned-avatar-ph{width:28px;height:28px;border-radius:50%;border:2px solid var(--primary);background:rgba(var(--primary-rgb),0.1);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:var(--primary);flex-shrink:0;cursor:pointer;transition:.2s}
.pinned-avatar-ph:hover{opacity:.8;transform:scale(1.1)}
.pinned-content{flex:1;min-width:0}
.pinned-author{font-size:.7rem;font-weight:700;opacity:.8}
.pinned-text{font-size:.85rem;line-height:1.3;word-wrap:break-word;margin-top:2px}
.msg-row{display:flex;gap:8px;align-items:flex-start;max-width:85%;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg-row.me{flex-direction:row-reverse;align-self:flex-end}
.msg-row.other{align-self:flex-start}
.msg-row.admin{align-self:flex-start}
.msg-row.system{align-self:center;max-width:90%}
.msg-avatar{width:32px;height:32px;border-radius:50%;border:2px solid var(--primary);object-fit:cover;flex-shrink:0;background:rgba(var(--primary-rgb),0.1);cursor:pointer;transition:.2s}
.msg-avatar:hover{opacity:.8;transform:scale(1.1)}
.msg-avatar-ph{width:32px;height:32px;border-radius:50%;border:2px solid var(--primary);background:rgba(var(--primary-rgb),0.1);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:var(--primary);flex-shrink:0;cursor:pointer;transition:.2s}
.msg-avatar-ph:hover{opacity:.8;transform:scale(1.1)}
.msg-content{display:flex;flex-direction:column;min-width:0}
.msg{padding:10px 15px;border-radius:12px;font-size:.9rem;line-height:1.4;word-wrap:break-word;position:relative}
.msg.other{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08)}
.msg.me{background:var(--primary);color:#000}
.msg.admin{background:rgba(var(--primary-rgb),0.15);border:1px solid var(--border)}
.msg-author{font-size:.75rem;font-weight:700;margin-bottom:3px;opacity:.8}
.msg.me .msg-author{opacity:.7}
.msg-text{word-wrap:break-word;overflow-wrap:break-word}
.msg-time{font-size:.65rem;opacity:.5;margin-top:3px}
.msg.edited{font-size:.65rem;opacity:.4;font-style:italic}
.msg.system{background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.1);font-size:.8rem;color:#666;text-align:center}
.msg-actions{display:flex;gap:4px;margin-top:4px;opacity:.6;transition:.2s}
.msg-actions button{padding:4px 8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;cursor:pointer;font-size:.8rem;transition:.2s;color:#aaa}
.msg-actions button:hover{border-color:var(--primary);color:var(--primary);background:rgba(var(--primary-rgb),0.1)}
.msg-actions button.danger:hover{border-color:#ff4444;color:#ff4444;background:rgba(255,68,68,0.1)}
.msg-actions button.pinned-active{border-color:var(--primary);color:var(--primary)}
.edit-input{width:100%;min-height:60px;padding:8px;background:rgba(0,0,0,0.3);border:1px solid var(--primary);border-radius:8px;color:#fff;font-size:.9rem;font-family:'Montserrat',sans-serif;resize:vertical;outline:none}
.edit-btns{display:flex;gap:6px;margin-top:6px}
.edit-save{padding:6px 14px;background:var(--primary);border:none;border-radius:6px;color:#000;font-weight:700;cursor:pointer;font-size:.8rem;font-family:'Montserrat',sans-serif}
.edit-cancel{padding:6px 14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:6px;color:#fff;cursor:pointer;font-size:.8rem;font-family:'Montserrat',sans-serif}
.msg-media{margin-top:6px;border-radius:8px;overflow:hidden;max-width:300px}
.msg-media img{width:100%;border-radius:8px;cursor:pointer;display:block}
.msg-media video{width:100%;border-radius:8px;display:block;max-height:300px}
.msg-media audio{width:100%}
.msg-media-file{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;text-decoration:none;color:var(--primary);font-size:.85rem;transition:.2s}
.msg-media-file:hover{background:rgba(255,255,255,0.1)}
.msg-media-file-icon{font-size:1.5rem}
.emoji-panel{display:none;position:fixed;bottom:65px;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:rgba(17,17,17,0.98);border:1px solid var(--border);border-radius:12px 12px 0 0;padding:12px;z-index:100;box-shadow:0 -5px 30px rgba(0,0,0,0.5);animation:slideUp .2s ease}
.emoji-panel.open{display:block}
@keyframes slideUp{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.emoji-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.emoji-tab{padding:6px 12px;border:1px solid rgba(255,255,255,0.1);border-radius:6px;background:transparent;color:#888;cursor:pointer;font-size:1rem;transition:.2s}
.emoji-tab.active{border-color:var(--primary);color:var(--primary);background:rgba(var(--primary-rgb),0.1)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:200px;overflow-y:auto}
.emoji-grid::-webkit-scrollbar{width:4px}
.emoji-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.emoji-btn{font-size:1.4rem;padding:6px;text-align:center;cursor:pointer;border-radius:6px;transition:.15s;background:transparent;border:none}
.emoji-btn:hover{background:rgba(255,255,255,0.08);transform:scale(1.2)}
.input-bar{display:flex;gap:8px;padding:12px 20px;background:rgba(5,5,5,0.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);flex-shrink:0;align-items:center;position:relative}
.input-bar input[type=text]{flex:1;padding:12px 15px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#fff;font-size:.9rem;outline:none;transition:.3s;font-family:'Montserrat',sans-serif}
.input-bar input[type=text]:focus{border-color:var(--primary);box-shadow:0 0 12px var(--shadow)}
.emoji-toggle{padding:12px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;cursor:pointer;font-size:1.2rem;transition:.3s;color:#aaa}
.emoji-toggle:hover{border-color:var(--primary);color:var(--primary)}
.file-btn{padding:12px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;cursor:pointer;font-size:1.2rem;transition:.3s;color:#aaa;flex-shrink:0}
.file-btn:hover{border-color:var(--primary);color:var(--primary)}
.voice-btn{padding:12px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;cursor:pointer;font-size:1.2rem;transition:.3s;color:#aaa;flex-shrink:0}
.voice-btn:hover{border-color:var(--primary);color:var(--primary)}
.voice-btn.recording{background:#ff3333;border-color:#ff3333;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.send-btn{padding:12px 20px;background:var(--primary);border:none;border-radius:8px;color:#000;font-weight:900;cursor:pointer;transition:.3s;font-family:'Orbitron',sans-serif;font-size:1.1rem;line-height:1;flex-shrink:0}
.send-btn:hover{box-shadow:0 0 20px var(--shadow);transform:translateY(-2px)}
.send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.upload-progress{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.95);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:.85rem;z-index:150;display:none;box-shadow:0 0 30px rgba(var(--primary-rgb),0.3)}
.upload-progress.show{display:block}
.upload-bar{width:200px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;margin-top:6px;overflow:hidden}
.upload-bar-fill{height:100%;background:var(--primary);border-radius:3px;transition:width .3s;width:0%}
.voice-recording{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.95);border:1px solid #ff3333;border-radius:10px;padding:12px 20px;font-size:.85rem;z-index:150;display:none;box-shadow:0 0 30px rgba(255,50,50,0.3)}
.voice-recording.show{display:block}
.voice-recording-timer{font-size:1.1rem;font-weight:700;color:#ff3333}
.voice-recording-hint{font-size:.75rem;color:#888;margin-top:4px}
.profile-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.profile-modal.open{display:flex}
.profile-modal-card{background:rgba(20,20,20,0.95);border:1px solid var(--border);border-radius:16px;padding:30px;width:90%;max-width:350px;text-align:center;box-shadow:0 0 60px rgba(var(--primary-rgb),0.2);animation:fadeIn .2s ease}
.profile-modal-avatar{width:90px;height:90px;border-radius:50%;border:3px solid var(--primary);object-fit:cover;margin:0 auto 15px;display:block;box-shadow:0 0 20px var(--shadow)}
.profile-modal-avatar-ph{width:90px;height:90px;border-radius:50%;border:3px solid var(--primary);background:rgba(var(--primary-rgb),0.1);display:flex;align-items:center;justify-content:center;font-size:2rem;font-family:'Orbitron',sans-serif;font-weight:900;color:var(--primary);margin:0 auto 15px}
.profile-modal-name{font-family:'Orbitron',sans-serif;font-size:1.3rem;margin-bottom:5px}
.profile-modal-info{display:flex;gap:20px;justify-content:center;margin:15px 0}
.profile-modal-info .info-item{text-align:center}
.profile-modal-info .info-label{font-size:.7rem;color:#555;text-transform:uppercase;margin-bottom:2px}
.profile-modal-info .info-value{font-size:1rem;font-weight:700}
.profile-modal-info .info-value span{color:var(--primary)}
.profile-modal-close{margin-top:15px;padding:10px 24px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff;cursor:pointer;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.85rem;transition:.3s}
.profile-modal-close:hover{border-color:var(--primary);color:var(--primary)}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:300;align-items:center;justify-content:center;cursor:pointer}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain}
@media(max-width:600px){nav{padding:8px 12px;flex-wrap:wrap;gap:8px}.msg-row{max-width:95%}.input-bar{padding:10px 12px}.emoji-grid{grid-template-columns:repeat(6,1fr)}.nav-right{flex-wrap:wrap}.msg-media{max-width:230px}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="particles" id="particles"></div>
<nav>
<div class="nav-left">
<a href="index.html" class="back-btn">&larr; Главная</a>
<button class="logout-btn" onclick="logout()">Выйти</button>
</div>
<div class="nav-right">
<a href="profile.html" class="nav-btn">Профиль</a>
<a href="games.html" class="nav-btn">🎮 Игры</a>
<div class="user-badge" id="userBadge"></div>
</div>
</nav>
<div class="chat-title">Чат <span>класса</span></div>
<div id="chatBox"></div>
<div class="upload-progress" id="uploadProgress">
<div id="uploadText">Загрузка...</div>
<div class="upload-bar"><div class="upload-bar-fill" id="uploadBarFill"></div></div>
</div>
<div class="voice-recording" id="voiceRecording">
<div class="voice-recording-timer" id="voiceTimer">0:00</div>
<div class="voice-recording-hint">Нажмите 🎤 снова чтобы остановить (макс 5 мин)</div>
</div>
<div class="emoji-panel" id="emojiPanel">
<div class="emoji-tabs">
<button class="emoji-tab active" onclick="switchEmojiTab('smile',this)">😊</button>
<button class="emoji-tab" onclick="switchEmojiTab('gest',this)">👍</button>
<button class="emoji-tab" onclick="switchEmojiTab('love',this)">❤️</button>
<button class="emoji-tab" onclick="switchEmojiTab('anim',this)">🐶</button>
<button class="emoji-tab" onclick="switchEmojiTab('food',this)">🍕</button>
<button class="emoji-tab" onclick="switchEmojiTab('act',this)">⚽</button>
<button class="emoji-tab" onclick="switchEmojiTab('obj',this)">💡</button>
<button class="emoji-tab" onclick="switchEmojiTab('flag',this)">🏁</button>
</div>
<div class="emoji-grid" id="emojiGrid"></div>
</div>
<div class="input-bar">
<div class="emoji-toggle" onclick="toggleEmoji()">😎</div>
<button class="file-btn" onclick="document.getElementById('fileInput').click()">📎</button>
<button class="voice-btn" id="voiceBtn" onclick="toggleVoiceRecord()">🎤</button>
<input type="file" id="fileInput" accept="image/*,video/*,audio/*" style="display:none">
<input type="text" id="msgInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter')sendMsg()" maxlength="500">
<button class="send-btn" id="sendBtn" onclick="sendMsg()">→</button>
</div>
<div class="profile-modal" id="profileModal" onclick="if(event.target===this)closeProfileModal()">
<div class="profile-modal-card">
<div id="profileModalAvatar"></div>
<div class="profile-modal-name" id="profileModalName"></div>
<div class="profile-modal-info">
<div class="info-item"><div class="info-label">Логин</div><div class="info-value" id="profileModalLogin"></div></div>
<div class="info-item"><div class="info-label">Роль</div><div class="info-value" id="profileModalRole"></div></div>
<div class="info-item"><div class="info-label">Сообщений</div><div class="info-value" id="profileModalMsgCount"><span>0</span></div></div>
</div>
<button class="profile-modal-close" onclick="closeProfileModal()">Закрыть</button>
</div>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightboxImg" src="" alt=""></div>
<script src="settings.js"></script>
<script>
const REPO='6m-class/6m-class';
const API=`https://api.github.com/repos/${REPO}`;
const _k='6m-class';const _e=[81,4,89,11,25,3,44,3,87,25,114,82,93,35,64,56,127,52,98,50,92,15,18,61,119,24,87,80,56,6,29,69,83,50,28,84,30,50,38,10,80,39,65,49,89,34,27,52,64,12,124,4,0,45,23,2,66,8,96,25,20,89,20,55,123,7,68,1,40,84,39,7,111,42,21,40,38,59,65,64,99,88,103,32,33,83,21,5,78,6,26,20,61];
const TOKEN=_e.map((c,i)=>String.fromCharCode(c^_k.charCodeAt(i%_k.length))).join('');
const user=JSON.parse(localStorage.getItem('class_user')||'null');
if(!user){window.location.href='login.html';}
const isAdmin=user.role==='admin';
let avatarCache={};
let allAccounts=[];
let commentsCache={};
let pinnedIds=[];
let chatIssueNum=null;
let isSending=false;
let editingId=null;
let isRecording=false;
let mediaRecorder=null;
let recordedChunks=[];
let recordStartTime=0;
let recordTimerInterval=null;
let uploadInProgress=false;

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmt(d){return new Date(d).toLocaleString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
async function fetchJSON(url,opts={},ms=30000){
const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
const r=await fetch(url,{...opts,signal:c.signal});
const data=await r.json().catch(()=>({message:'JSON parse error'}));
if(!r.ok)throw new Error(data.message||('HTTP '+r.status));
return data;
}
const headers={'Authorization':`Bearer ${TOKEN}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
function encodeB64(str){const bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function fileToB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const b=r.result.split(',')[1];res(b)};r.onerror=rej;r.readAsDataURL(file)})}

function showUploadProgress(text,pct){
const el=document.getElementById('uploadProgress');
document.getElementById('uploadText').textContent=text;
document.getElementById('uploadBarFill').style.width=pct+'%';
el.classList.add('show');
}
function hideUploadProgress(){
document.getElementById('uploadProgress').classList.remove('show');

async function sendFile(file){
if(uploadInProgress)return;
if(file.size>100*1024*1024){alert('Файл слишком большой. Максимум 100 МБ.');return;}
uploadInProgress=true;
showUploadProgress('Подготовка файла...',0);
try{
const ext=(file.name.split('.').pop()||'bin').toLowerCase().substring(0,5);
const fileName=`chat_media/${user.login}_${Date.now()}.${ext}`;
const path=encodeURIComponent(fileName);
showUploadProgress('Кодирование файла...',30);
const base64Data=await fileToB64(file);
showUploadProgress('Загрузка на сервер...',50);
let putBody={message:`Upload media: ${file.name}`,content:base64Data};
let fileResp;
try{
fileResp=await fetchJSON(`${API}/contents/${path}`,{
method:'PUT',
headers:{...headers,'Content-Type':'application/json'},
body:JSON.stringify(putBody)
},120000);
}catch(e){
if(e.message&&e.message.includes('409')){
fileResp=await fetchJSON(`${API}/contents/${path}`,{
method:'PUT',
headers:{...headers,'Content-Type':'application/json'},
body:JSON.stringify(putBody)
},120000);
}else{throw e;}
}
const rawUrl=(fileResp.content&&fileResp.content.download_url)||`https://raw.githubusercontent.com/${REPO}/main/${fileName}`;
showUploadProgress('Отправка сообщения...',80);
let mediaType='file';
const mtype=file.type||'';
if(mtype.startsWith('image/'))mediaType='image';
else if(mtype.startsWith('video/'))mediaType='video';
else if(mtype.startsWith('audio/'))mediaType='audio';
const body=JSON.stringify({name:user.name,text:'',role:user.role,login:user.login,media:rawUrl,mediaType:mediaType,mediaName:file.name});
await fetchJSON(`${API}/issues/${chatIssueNum}/comments`,{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({body:body})},10000);
showUploadProgress('Готово!',100);
await loadMessages();
}catch(e){
alert('Ошибка загрузки: '+e.message);
}finally{
hideUploadProgress();
uploadInProgress=false;
}
}

// ===== VOICE RECORDING =====
async function toggleVoiceRecord(){
if(isRecording){stopVoiceRecord();return;}
try{
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
mediaRecorder=new MediaRecorder(stream);
recordedChunks=[];
mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recordedChunks.push(e.data)};
mediaRecorder.onstop=async()=>{
stream.getTracks().forEach(t=>t.stop());
const blob=new Blob(recordedChunks,{type:'audio/webm'});
if(blob.size>5*1024*1024){alert('Голосовое сообщение слишком большое (более 5 МБ). Попробуйте короче.');return;}
await sendFile(new File([blob],`voice_${Date.now()}.webm`,{type:'audio/webm'}));
};
mediaRecorder.start();
isRecording=true;
recordStartTime=Date.now();
document.getElementById('voiceBtn').classList.add('recording');
document.getElementById('voiceRecording').classList.add('show');
recordTimerInterval=setInterval(()=>{
const elapsed=Math.floor((Date.now()-recordStartTime)/1000);
const m=Math.floor(elapsed/60);
const s=elapsed%60;
document.getElementById('voiceTimer').textContent=`${m}:${String(s).padStart(2,'0')}`;
if(elapsed>=300){stopVoiceRecord();}
},200);
}catch(e){alert('Не удалось получить доступ к микрофону: '+e.message);}
}
function stopVoiceRecord(){
if(!isRecording)return;
isRecording=false;
clearInterval(recordTimerInterval);
document.getElementById('voiceBtn').classList.remove('recording');
document.getElementById('voiceRecording').classList.remove('show');
if(mediaRecorder&&mediaRecorder.state!=='inactive'){mediaRecorder.stop();}
}

// ===== MEDIA RENDERING =====
function renderMedia(p){
if(!p.media)return '';
const url=p.media;
const mtype=p.mediaType||'file';
if(mtype==='image'){
return `<div class="msg-media"><img src="${url}?t=${Date.now()}" alt="" onclick="openLightbox('${url}?t=${Date.now()}')"></div>`;
}else if(mtype==='video'){
return `<div class="msg-media"><video src="${url}" controls preload="metadata"></video></div>`;
}else if(mtype==='audio'){
return `<div class="msg-media"><audio data-src="${url}" controls preload="none"></audio></div>`;
}else{
const fname=esc(p.mediaName||'Файл');
return `<a class="msg-media-file" href="${url}" target="_blank"><span class="msg-media-file-icon">📎</span>${fname}</a>`;
}
}

async function loadMessages(){
if(!chatIssueNum)return;
try{
const comments=await fetchJSON(`${API}/issues/${chatIssueNum}/comments?per_page=100&t=${Date.now()}`,{cache:'no-store',headers},10000);
commentsCache={};
comments.forEach(c=>{
let parsed;
try{parsed=JSON.parse(c.body);}catch(e){parsed={name:c.user.login,text:c.body,role:'student',login:c.user.login};}
commentsCache[c.id]={parsed,raw:c,commentId:c.id};
});
const box=document.getElementById('chatBox');
box.innerHTML='';
const pinned=comments.filter(c=>pinnedIds.includes(c.id));
if(pinned.length>0){
const psec=document.createElement('div');
psec.className='pinned-section';
psec.innerHTML='<div class="pinned-header">📌 Закреплённые</div>';
pinned.forEach(c=>{
const cached=commentsCache[c.id];
const p=cached.parsed;
const avHTML=getPinnedAvatarHTML(p.login||c.user.login,p.name);
let pinActions='';
if(isAdmin){pinActions=`<button onclick="togglePin(${c.id})" class="pinned-active" title="Открепить">📌</button>`;}
const mediaHTML=renderMedia(p);
psec.innerHTML+=`<div class="pinned-msg">${avHTML}<div class="pinned-content"><div class="pinned-author">${esc(p.name)}${p.role==='admin'?' 👑':''}</div><div class="pinned-text">${esc(p.text)}</div>${mediaHTML}</div><div class="msg-actions">${pinActions}</div></div>`;
});
box.appendChild(psec);
}
if(comments.length===0){
box.innerHTML='<div class="msg-row system"><div class="msg system">Сообщений пока нет. Напиши первым!</div></div>';
return;
}
comments.forEach(c=>{
const cached=commentsCache[c.id];
const p=cached.parsed;
const isMe=p.name===user.name||(p.login===user.login);
const cls=isMe?'me':(p.role==='admin'?'admin':'other');
const isPinned=pinnedIds.includes(c.id);
const avHTML=getAvatarHTML(p.login||c.user.login,p.name);
let actionsHTML='';
if(isAdmin){
actionsHTML=`<div class="msg-actions">
<button onclick="togglePin(${c.id})" class="${isPinned?'pinned-active':''}" title="${isPinned?'Открепить':'Закрепить'}">📌</button>
<button onclick="startEdit(${c.id})" title="Изменить">✏️</button>
<button onclick="deleteMsg(${c.id})" class="danger" title="Удалить">🗑️</button>
</div>`;
}
const editedTag=p.edited?'<span class="msg edited">(изменено)</span>':'';
const pinBadge=isPinned?'📌 ':'';
const mediaHTML=renderMedia(p);
const row=document.createElement('div');
row.className='msg-row '+cls;
row.dataset.cid=c.id;
const textHTML=p.text?`<div class="msg-text">${pinBadge}${esc(p.text)}</div>`:(mediaHTML?`<div class="msg-text">${pinBadge}</div>`:'');
row.innerHTML=`${avHTML}<div class="msg-content"><div class="msg ${cls}"><div class="msg-author">${esc(p.name)}${p.role==='admin'?' 👑':''}</div>${textHTML}${mediaHTML}<div class="msg-time">${fmt(c.created_at)} ${editedTag}</div></div>${actionsHTML}</div>`;
box.appendChild(row);
});
box.querySelectorAll('audio[data-src]').forEach(async audio=>{
try{
const resp=await fetch(audio.dataset.src);
const blob=await resp.blob();
audio.src=URL.createObjectURL(blob);
audio.load();
}catch(e){
audio.src=audio.dataset.src;
audio.load();
}
});
box.scrollTop=box.scrollHeight;
}catch(e){}
}

async function deleteMsg(commentId){

try{
await fetch(`${API}/issues/comments/${commentId}`,{method:'DELETE',headers});
if(pinnedIds.includes(commentId)){
pinnedIds=pinnedIds.filter(id=>id!==commentId);
await savePinned();
}
await loadMessages();
}catch(e){alert('Ошибка удаления: '+(e.message||'нет прав'));}

function startEdit(commentId){

async function saveEdit(commentId){

const newText=inp.value.trim();
if(!newText)return;
const cached=commentsCache[commentId];
if(!cached)return;
cached.parsed.text=newText;
cached.parsed.edited=true;
try{
await fetchJSON(`${API}/issues/comments/${commentId}`,{
method:'PATCH',
headers:{...headers,'Content-Type':'application/json'},
body:JSON.stringify({body:JSON.stringify(cached.parsed)})
},10000);
editingId=null;
await loadMessages();
}catch(e){alert('Ошибка: '+e.message);}
}
function cancelEdit(){editingId=null;loadMessages();}
async function togglePin(commentId){

pinnedIds.push(commentId);
}
await savePinned();
await loadMessages();
