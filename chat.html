<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чат | Самый лучший класс</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="settings.js"></script>
<style>
:root{--primary:#ff0033;--primary-rgb:255,0,51;--glow:rgba(255,0,51,0.15);--glow-strong:rgba(255,0,51,0.8);--border:rgba(255,0,51,0.3);--shadow:rgba(255,0,51,0.2)}
[data-theme="yellow"]{--primary:#ffcc00;--primary-rgb:255,204,0;--glow:rgba(255,204,0,0.15);--glow-strong:rgba(255,204,0,0.8);--border:rgba(255,204,0,0.3);--shadow:rgba(255,204,0,0.2)}
[data-theme="green"]{--primary:#00ff66;--primary-rgb:0,255,102;--glow:rgba(0,255,102,0.15);--glow-strong:rgba(0,255,102,0.8);--border:rgba(0,255,102,0.3);--shadow:rgba(0,255,102,0.2)}
[data-theme="blue"]{--primary:#00aaff;--primary-rgb:0,170,255;--glow:rgba(0,170,255,0.15);--glow-strong:rgba(0,170,255,0.8);--border:rgba(0,170,255,0.3);--shadow:rgba(0,170,255,0.2)}
[data-theme="purple"]{--primary:#aa00ff;--primary-rgb:170,0,255;--glow:rgba(170,0,255,0.15);--glow-strong:rgba(170,0,255,0.8);--border:rgba(170,0,255,0.3);--shadow:rgba(170,0,255,0.2)}
[data-theme="aero"]{--primary:#00ffff;--primary-rgb:0,255,255;--glow:rgba(0,255,255,0.15);--glow-strong:rgba(0,255,255,0.8);--border:rgba(0,255,255,0.3);--shadow:rgba(0,255,255,0.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;height:100vh}
.bg-glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100vw;height:40vh;background:radial-gradient(ellipse at top,var(--glow),transparent 70%);z-index:-2;pointer-events:none}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.particle{position:absolute;background:var(--primary);border-radius:50%;box-shadow:0 0 5px var(--primary);animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:0.4}100%{transform:translateY(-10vh) scale(1);opacity:0}}
nav{padding:12px 20px;display:flex;justify-content:space-between;align-items:center;background:rgba(5,5,5,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);flex-shrink:0}
.nav-left{display:flex;gap:10px;align-items:center}
.back-btn{color:#fff;text-decoration:none;font-weight:700;text-transform:uppercase;font-size:.85rem;padding:8px 16px;border:1px solid rgba(255,255,255,0.3);border-radius:4px;transition:.3s}
.back-btn:hover{border-color:var(--primary);color:var(--primary)}
.profile-link{color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;padding:8px 16px;border:1px solid var(--border);border-radius:4px;transition:.3s;background:rgba(var(--primary-rgb),0.05)}
.profile-link:hover{border-color:var(--primary);color:var(--primary)}
.user-badge{font-size:.85rem;color:#aaa;display:flex;align-items:center;gap:8px}
.user-badge b{color:var(--primary)}
.user-avatar{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);object-fit:cover}
.user-avatar-placeholder{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.chat-title{font-family:'Orbitron',sans-serif;font-size:1.1rem;text-transform:uppercase;text-align:center;flex-shrink:0;padding:8px}
.chat-title span{color:var(--primary)}
#chatBox{flex:1;overflow-y:auto;padding:15px 20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:10px 15px;border-radius:12px;font-size:.9rem;line-height:1.4;word-wrap:break-word;animation:fadeIn .3s ease;position:relative}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg.other{align-self:flex-start;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08)}
.msg.me{align-self:flex-end;background:var(--primary);color:#000}
.msg.admin{align-self:flex-start;background:rgba(var(--primary-rgb),0.15);border:1px solid var(--border)}
.msg-row{display:flex;gap:8px;align-items:flex-end}
.msg-row.me{flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);object-fit:cover;flex-shrink:0;background:rgba(255,255,255,0.05)}
.msg-avatar-placeholder{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;color:#666}
.msg-content{min-width:0}
.msg-author{font-size:.75rem;font-weight:700;margin-bottom:3px;opacity:.8}
.msg.me .msg-author{opacity:.7}
.msg-time{font-size:.65rem;opacity:.5;margin-top:3px}
.msg.system{align-self:center;background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.1);font-size:.8rem;color:#666;text-align:center;max-width:90%}
.emoji-panel{display:none;position:fixed;bottom:65px;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:rgba(17,17,17,0.98);border:1px solid var(--border);border-radius:12px 12px 0 0;padding:12px;z-index:100;box-shadow:0 -5px 30px rgba(0,0,0,0.5);animation:slideUp .2s ease}
.emoji-panel.open{display:block}
@keyframes slideUp{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.emoji-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.emoji-tab{padding:6px 12px;border:1px solid rgba(255,255,255,0.1);border-radius:6px;background:transparent;color:#888;cursor:pointer;font-size:1rem;transition:.2s}
.emoji-tab.active{border-color:var(--primary);color:var(--primary);background:rgba(var(--primary-rgb),0.1)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:200px;overflow-y:auto}
.emoji-grid::-webkit-scrollbar{width:4px}
.emoji-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.emoji-btn{font-size:1.4rem;padding:6px;text-align:center;cursor:pointer;border-radius:6px;transition:.15s;background:transparent;border:none}
.emoji-btn:hover{background:rgba(255,255,255,0.08);transform:scale(1.2)}
.input-bar{display:flex;gap:8px;padding:12px 20px;background:rgba(5,5,5,0.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);flex-shrink:0;align-items:center;position:relative}
.input-bar input{flex:1;padding:12px 15px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#fff;font-size:.9rem;outline:none;transition:.3s;font-family:'Montserrat',sans-serif}
.input-bar input:focus{border-color:var(--primary);box-shadow:0 0 12px var(--shadow)}
.emoji-toggle{padding:12px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;cursor:pointer;font-size:1.2rem;transition:.3s;color:#aaa}
.emoji-toggle:hover{border-color:var(--primary);color:var(--primary)}
.input-bar button.send-btn{padding:12px 20px;background:var(--primary);border:none;border-radius:8px;color:#000;font-weight:700;cursor:pointer;transition:.3s;font-family:'Orbitron',sans-serif;font-size:.85rem;text-transform:uppercase}
.input-bar button.send-btn:hover{box-shadow:0 0 20px var(--shadow);transform:translateY(-2px)}
.input-bar button.send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
@media(max-width:600px){nav{padding:8px 12px}.msg{max-width:90%}.input-bar{padding:10px 12px}.emoji-grid{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="particles" id="particles"></div>
<nav>
<div class="nav-left">
<a href="index.html" class="back-btn">← Главная</a>
<a href="profile.html" class="profile-link">👤 Профиль</a>
</div>
<div class="user-badge" id="userBadge"></div>
</nav>
<div class="chat-title">💬 Чат <span>класса</span></div>
<div id="chatBox"></div>
<div class="emoji-panel" id="emojiPanel">
<div class="emoji-tabs">
<button class="emoji-tab active" onclick="switchEmojiTab('smile',this)">😊</button>
<button class="emoji-tab" onclick="switchEmojiTab('gest',this)">👍</button>
<button class="emoji-tab" onclick="switchEmojiTab('love',this)">❤️</button>
<button class="emoji-tab" onclick="switchEmojiTab('anim',this)">🐶</button>
<button class="emoji-tab" onclick="switchEmojiTab('food',this)">🍕</button>
<button class="emoji-tab" onclick="switchEmojiTab('act',this)">⚽</button>
<button class="emoji-tab" onclick="switchEmojiTab('obj',this)">💡</button>
<button class="emoji-tab" onclick="switchEmojiTab('flag',this)">🏁</button>
</div>
<div class="emoji-grid" id="emojiGrid"></div>
</div>
<div class="input-bar">
<div class="emoji-toggle" onclick="toggleEmoji()">😎</div>
<input type="text" id="msgInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter')sendMsg()" maxlength="500">
<button class="send-btn" id="sendBtn" onclick="sendMsg()">📤</button>
</div>
<script src="settings.js"></script>
<script>
const REPO='6m-class/6m-class';
const API=`https://api.github.com/repos/${REPO}`;
const _k='6m-class';const _e=[81,4,89,11,25,3,44,3,87,25,114,82,93,35,64,56,127,52,98,50,92,15,18,61,119,24,87,80,56,6,29,69,83,50,28,84,30,50,38,10,80,39,65,49,89,34,27,52,64,12,124,4,0,45,23,2,66,8,96,25,20,89,20,55,123,7,68,1,40,84,39,7,111,42,21,40,38,59,65,64,99,88,103,32,33,83,21,5,78,6,26,20,61];const TOKEN=_e.map((c,i)=>String.fromCharCode(c^_k.charCodeAt(i%_k.length))).join('');
const user=JSON.parse(localStorage.getItem('class_user')||'null');
if(!user){window.location.href='login.html';}
// Render user badge with avatar
function renderBadge(){
const b=document.getElementById('userBadge');
if(user.photo){
b.innerHTML=`<img class="user-avatar" src="${esc(user.photo)}?t=${Date.now()}" onerror="this.outerHTML='<div class=\\'user-avatar-placeholder\\'>👤</div>'"><b>${esc(user.name)}</b>${user.role==='admin'?' 👑':''}`;
}else{
b.innerHTML=`<div class="user-avatar-placeholder">👤</div><b>${esc(user.name)}</b>${user.role==='admin'?' 👑':''}`;
}
}
renderBadge();
let chatIssueNum=null;
let lastCommentId=0;
let pollTimer=null;
let isSending=false;
let accountPhotos={};
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmt(d){return new Date(d).toLocaleString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
async function fetchT(url,opts={},ms=10000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{...opts,signal:c.signal}).finally(()=>clearTimeout(t))}
// Load account photos from data.json
async function loadAccountPhotos(){
try{
const urls=[
`https://raw.githubusercontent.com/${REPO}/main/data.json?v=${Date.now()}`,
`https://raw.githubusercontent.com/${REPO}/master/data.json?v=${Date.now()}`,
`https://cdn.jsdelivr.net/gh/${REPO}@main/data.json?v=${Date.now()}`,
`data.json?v=${Date.now()}`
];
for(const url of urls){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),8000);const r=await fetch(url,{cache:'no-store',signal:c.signal});clearTimeout(t);if(r.ok){const data=await r.json();const accounts=Array.isArray(data.accounts)?data.accounts:[];accounts.forEach(a=>{if(a.photo&&a.login)accountPhotos[a.login]=a.photo;});const userAcc=accounts.find(a=>a.login===user.login);if(userAcc&&userAcc.photo&&userAcc.photo!==user.photo){user.photo=userAcc.photo;localStorage.setItem('class_user',JSON.stringify(user));renderBadge();}return;}}catch(e){continue}}
}catch(e){}
}
// Emoji
const emojiData={
smile:'😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😗 😙 😚 😋 😛 😝 😜 🤪 🤨 🧐 🤓 😎 🥸 🤩 🥳 😏 😒 😞 😔 😟 😕 🙁 ☹️ 😣 😖 😫 😩 🥺 😢 😭 😤 😠 😡 🤬 🤯 😳 🥵 🥶 😱 😨 😰 😥 😓 🤗 🤔 🤭 🤫 🤥 😶 😐 😑 😬 🙄 😯 😦 😧 😮 😲 🥱 😴 🤤 😪 😵 🤐 🥴 🤢 🤮 🤧 😷 🤒 🤕'.split(' '),
gest:'👍 👎 👌 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 ☝️ ✋ 🤚 🖐️ 🖖 👋 🤝 👏 🙌 👐 🙏 ✍️ 💅 🤳 💪 🦾 👂 👃 👀 👁️ 👅 👄 🦷'.split(' '),
love:'❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❣️ 💕 💞 💓 💗 💖 💘 💝 💟 ✨ 🔥 💥 ⭐ 🌟 ✅ ❌ ⚠️ 〽️'.split(' '),
anim:'🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🐦 🐤 🦆 🦅 🦉 🦇 🐺 🐗 🐴 🦄 🐝 🐛 🦋 🐌 🐞 🐢 🐍 🦎 🦖 🦕 🐙 🦑 🦐 🦀 🐠 🐟 🐬 🐳 🐋 🦈 🐊 🐅 🐆 🦓 🦍 🐘 🦛 🦏 🐪 🐫 🦒 🐃 🐂 🐎 🐖 🐏 🐑 🦙'.split(' '),
food:'🍕 🍔 🍟 🌭 🥪 🌮 🌯 🥙 🧆 🥚 🍳 🥘 🍲 🫕 🥞 🧇 🧀 🍖 🍗 🥩 🥓 🥨 🥯 🍩 🍪 🎂 🍰 🧁 🍫 🍬 🍭 🍦 🍨 🍧 🥧 🍎 🍏 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍈 🍒 🍑 🥭 🍍 🥥 🥝 🍅 🥑 🥦 🥬 🥒 🌶️ 🫑 🌽 🥕 🧄 🧅 🥔 🍠 🥐'.split(' '),
act:'⚽ 🏀 🏈 ⚾ 🥎 🎾 🏐 📉 🏉 🎱 🏓 🏸 🥅 🏒 🏑 🥍 🏏 ⛳ 🏹 🎣 🥊 🥋 🎽 ⛸️ 🥌 🎿 ⛷️ 🏂 🏋️ 🤼 🤸 🎯 🎮 🕹️ 🎲 🎰 🎳 🎪 🎭 🎨 🎬 🎤 🎧 🎼 🎹 🥁 🎷 🎺 🎸 🎻 🪕 🎺'.split(' '),
obj:'💡 🔌 🔋 💻 🖥️ 🖨️ ⌨️ 🖱️ 💽 💾 💿 📀 📷 📸 🎥 🎞️ 📽️ 🎬 📺 📻 🎙️ 🎚️ 🎛️ 🧭 ⏰ ⏱️ ⏲️ 🕰️ ⌛ ⏳ 📡 🔋 🔌 💡 🔦 🕯️ 🧯 🔧 🔨 ⚒️ 🛠️ ⚙️ 🗜️ ⚖️ 🦯 🔗 ⛓️ 🧰 🧲'.split(' '),
flag:'🏁 🚩 🎌 🏴 🏳️ 🏳️‍🌈 🏴‍☠️ 🏁 🚩 🎌'.split(' ')
};
let currentEmojiTab='smile';
function toggleEmoji(){document.getElementById('emojiPanel').classList.toggle('open')}
function switchEmojiTab(tab,el){currentEmojiTab=tab;document.querySelectorAll('.emoji-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderEmojis()}
function renderEmojis(){const grid=document.getElementById('emojiGrid');grid.innerHTML=emojiData[currentEmojiTab].map(e=>`<button class="emoji-btn" onclick="insertEmoji('${e}')">${e}</button>`).join('')}
function insertEmoji(emoji){const input=document.getElementById('msgInput');input.value+=emoji;input.focus()}
// Chat
async function findChatIssue(){
try{
const r=await fetchT(`${API}/issues?labels=${encodeURIComponent('чат')}&state=open&per_page=5&t=${Date.now()}`,{cache:'no-store',headers:{'Authorization':`Bearer ${TOKEN}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
if(!r.ok)throw new Error('API '+r.status);
const issues=await r.json();
const chat=issues.find(i=>!i.pull_request);
if(chat){chatIssueNum=chat.number;return;}
}catch(e){}
try{
const r=await fetchT(`${API}/issues`,{method:'POST',headers:{'Authorization':`Bearer ${TOKEN}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify({title:'💬 Чат класса',body:'Этот issue используется как чат. Не закрывайте его.',labels:['чат']})});
const data=await r.json();chatIssueNum=data.number;
}catch(e){}
}
function getAvatarHtml(login,name){
const photo=accountPhotos[login];
if(photo){return `<img class="msg-avatar" src="${esc(photo)}?t=${Date.now()}" onerror="this.outerHTML='<div class=\\'msg-avatar-placeholder\\'>👤</div>'">`;}
return `<div class="msg-avatar-placeholder">${esc((name||'?')[0].toUpperCase())}</div>`;
}
async function loadMessages(){
if(!chatIssueNum)return;
try{
const r=await fetchT(`${API}/issues/${chatIssueNum}/comments?per_page=100&t=${Date.now()}`,{cache:'no-store',headers:{'Authorization':`Bearer ${TOKEN}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
if(!r.ok)return;
const comments=await r.json();
const box=document.getElementById('chatBox');
box.innerHTML='';
if(comments.length===0){box.innerHTML='<div class="msg system">Сообщений пока нет. Напиши первым! 👋</div>';return;}
comments.forEach(c=>{
let parsed;
try{parsed=JSON.parse(c.body);}catch(e){parsed={name:c.user.login,text:c.body,role:'student',login:c.user.login};}
const isMe=parsed.name===user.name||(parsed.login===user.login)||(c.user.login===user.login);
const cls=isMe?'me':(parsed.role==='admin'?'admin':'other');
const login=parsed.login||c.user.login;
const avatarHtml=getAvatarHtml(login,parsed.name);
const div=document.createElement('div');
div.className='msg '+cls;
div.innerHTML=`<div class="msg-row ${isMe?'me':''}">${avatarHtml}<div class="msg-content"><div class="msg-author">${esc(parsed.name)}${parsed.role==='admin'?' 👑':''}</div>${esc(parsed.text)}<div class="msg-time">${fmt(c.created_at)}</div></div></div>`;
box.appendChild(div);
});
box.scrollTop=box.scrollHeight;
lastCommentId=comments.length>0?comments[comments.length-1].id:0;
}catch(e){}
}
async function sendMsg(){
const input=document.getElementById('msgInput');
const text=input.value.trim();
if(!text||isSending)return;
isSending=true;
document.getElementById('sendBtn').disabled=true;
input.value='';
document.getElementById('emojiPanel').classList.remove('open');
try{
const body=JSON.stringify({name:user.name,text:text,role:user.role,login:user.login});
await fetchT(`${API}/issues/${chatIssueNum}/comments`,{method:'POST',headers:{'Authorization':`Bearer ${TOKEN}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify({body:body})});
await loadMessages();
}catch(e){alert('❌ Ошибка отправки: '+e.message);}
isSending=false;
document.getElementById('sendBtn').disabled=false;
}
// Close emoji panel on outside click
document.addEventListener('click',e=>{
const panel=document.getElementById('emojiPanel');
const toggle=document.querySelector('.emoji-toggle');
if(panel.classList.contains('open')&&!panel.contains(e.target)&&!toggle.contains(e.target)){panel.classList.remove('open');}
});
// Start
(async()=>{
renderEmojis();
await loadAccountPhotos();
await findChatIssue();
await loadMessages();
pollTimer=setInterval(loadMessages,5000);
setInterval(loadAccountPhotos,30000);
})();
// Particles
const isMobile=window.innerWidth<600;const pc=document.getElementById('particles');const count=isMobile?10:20;
for(let i=0;i<count;i++){const p=document.createElement('div');p.classList.add('particle');const s=Math.random()*3+1;p.style.width=`${s}px`;p.style.height=`${s}px`;p.style.left=`${Math.random()*100}vw`;p.style.animationDuration=`${Math.random()*10+6}s`;p.style.animationDelay=`${Math.random()*5}s`;pc.appendChild(p);}
</script>
</body>
</html>
