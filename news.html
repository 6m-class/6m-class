<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новости класса | Самый лучший класс</title>
<link rel="preconnect" href="https://api.github.com">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root { --primary:#ff0033; --glow:rgba(255,0,51,0.15); --glow-strong:rgba(255,0,51,0.8); --border:rgba(255,0,51,0.3); --shadow:rgba(255,0,51,0.2); --primary-rgb:255,0,51; }
[data-theme="blue"] { --primary:#00aaff; --glow:rgba(0,170,255,0.15); --glow-strong:rgba(0,170,255,0.8); --border:rgba(0,170,255,0.3); --shadow:rgba(0,170,255,0.2); --primary-rgb:0,170,255; }
[data-theme="green"] { --primary:#00ff66; --glow:rgba(0,255,102,0.15); --glow-strong:rgba(0,255,102,0.8); --border:rgba(0,255,102,0.3); --shadow:rgba(0,255,102,0.2); --primary-rgb:0,255,102; }
[data-theme="aero"] { --primary:#00ffff; --glow:rgba(0,255,255,0.15); --glow-strong:rgba(0,255,255,0.8); --border:rgba(0,255,255,0.3); --shadow:rgba(0,255,255,0.2); --primary-rgb:0,255,255; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050505; color:#fff; font-family:'Montserrat',sans-serif; min-height:100vh; overflow-x:hidden; }
.bg-glow { position:fixed; top:0; left:50%; transform:translateX(-50%); width:100vw; height:60vh; background:radial-gradient(ellipse at top,var(--glow),transparent 70%); z-index:-2; pointer-events:none; }
.particles { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none; }
.particle { position:absolute; background:var(--primary); border-radius:50%; box-shadow:0 0 5px var(--primary); animation:floatUp linear infinite; opacity:0; }
@keyframes floatUp { 0%{transform:translateY(100vh) scale(0);opacity:0} 50%{opacity:0.4} 100%{transform:translateY(-10vh) scale(1);opacity:0} }
.theme-switcher { position:fixed; top:20px; left:20px; display:flex; gap:8px; z-index:100; }
.theme-btn { width:26px; height:26px; border-radius:50%; border:2px solid rgba(255,255,255,0.2); cursor:pointer; opacity:0.6; transition:0.3s; }
.theme-btn:hover,.theme-btn.active { opacity:1; transform:scale(1.2); border-color:#fff; }
.theme-btn[data-set="red"]{background:#ff0033}.theme-btn[data-set="blue"]{background:#00aaff}
.theme-btn[data-set="green"]{background:#00ff66}.theme-btn[data-set="aero"]{background:#00ffff}
nav { padding:20px 40px; display:flex; justify-content:flex-end; align-items:center; background:rgba(5,5,5,0.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
.back-btn { color:#fff; text-decoration:none; font-weight:700; text-transform:uppercase; font-size:0.9rem; padding:8px 20px; border:1px solid rgba(255,255,255,0.3); border-radius:4px; transition:0.3s; }
.back-btn:hover { border-color:var(--primary); color:var(--primary); box-shadow:0 0 10px var(--shadow); }
.container { max-width:800px; margin:0 auto; padding:60px 20px 80px; }
h1 { font-family:'Orbitron',sans-serif; font-size:clamp(2rem,5vw,3rem); text-align:center; margin-bottom:10px; text-transform:uppercase; text-shadow:0 0 15px var(--glow-strong); animation:fadeInDown 0.8s ease-out; }
.highlight { color:var(--primary); }
.subtitle { text-align:center; color:#888; margin-bottom:50px; font-size:1rem; animation:fadeInDown 0.8s ease-out 0.2s both; }
.news-list { display:flex; flex-direction:column; gap:25px; }
.news-card { background:rgba(20,20,20,0.6); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:30px; position:relative; overflow:hidden; transition:all 0.4s ease; opacity:0; transform:translateY(30px); }
.news-card.visible { opacity:1; transform:translateY(0); }
.news-card::before { content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--primary); box-shadow:0 0 15px var(--shadow); }
.news-card:hover { border-color:var(--border); transform:translateY(-4px); box-shadow:0 10px 40px rgba(0,0,0,0.4); }
.news-date { font-size:0.75rem; color:var(--primary); text-transform:uppercase; letter-spacing:2px; font-weight:700; margin-bottom:10px; display:inline-block; background:rgba(255,255,255,0.03); padding:4px 12px; border-radius:20px; }
.news-title { font-family:'Orbitron',sans-serif; font-size:1.4rem; color:#fff; margin-bottom:12px; text-transform:uppercase; line-height:1.3; }
.news-text { color:#bbb; font-size:1rem; line-height:1.7; }
.empty { text-align:center; padding:60px 20px; color:#555; }
.empty .icon { font-size:3rem; margin-bottom:15px; }
.empty p { font-size:1.1rem; }
.loading { text-align:center; padding:60px 20px; }
.loading .spinner { display:inline-block; width:40px; height:40px; border:3px solid rgba(255,255,255,0.1); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; }
.loading p { margin-top:15px; color:#666; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes fadeInDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div class="theme-switcher">
    <div class="theme-btn" data-set="red"></div>
    <div class="theme-btn" data-set="blue"></div>
    <div class="theme-btn" data-set="green"></div>
    <div class="theme-btn" data-set="aero"></div>
</div>
<div class="bg-glow"></div>
<div class="particles" id="particles"></div>
<nav>
    <a href="index.html" class="back-btn">← На главную</a>
</nav>
<div class="container">
    <h1>Новости <span class="highlight">класса</span></h1>
    <p class="subtitle">Всё самое важное и интересное</p>
    <div class="news-list" id="newsList">
        <div class="loading"><div class="spinner"></div><p>Загрузка новостей...</p></div>
    </div>
</div>
<script>
const REPO = '6m-class/6m-class';
const RAW_BASE = `https://raw.githubusercontent.com/${REPO}`;
const API = `https://api.github.com/repos/${REPO}`;

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ===== КЭШ =====
const CACHE_TTL = 600000; // 10 минут
function getCached(key) {
  const c = JSON.parse(localStorage.getItem(key) || 'null');
  if (c && Date.now() - c.ts < CACHE_TTL) return c.data;
  return null;
}
function setCached(key, data) {
  localStorage.setItem(key, JSON.stringify({ data, ts: Date.now() }));
}

// ===== FETCH С ТАЙМАУТОМ =====
async function fetchWithTimeout(url, ms = 8000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
    clearTimeout(timer);
    return res;
  } catch (e) {
    clearTimeout(timer);
    throw e;
  }
}

// ===== ВЕТКА =====
async function getBranch() {
  const cached = JSON.parse(localStorage.getItem('gh_branch_cache') || 'null');
  if (cached && Date.now() - cached.ts < 3600000) return cached.branch;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    const res = await fetch(`${API}/branches/main?t=${Date.now()}`, { cache: 'no-store', signal: ctrl.signal });
    clearTimeout(timer);
    if (res.ok) {
      localStorage.setItem('gh_branch_cache', JSON.stringify({ branch: 'main', ts: Date.now() }));
      return 'main';
    }
  } catch (e) {}
  localStorage.setItem('gh_branch_cache', JSON.stringify({ branch: 'master', ts: Date.now() }));
  return 'master';
}

// ===== ТЕМА из data.json через raw =====
async function loadTheme(branch) {
  try {
    const res = await fetchWithTimeout(`${RAW_BASE}/${branch}/data.json?t=${Date.now()}`);
    if (res.ok) {
      const data = await res.json();
      const theme = data.theme || 'red';
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.set === theme));
      return data;
    }
  } catch (e) {
    // Фолбэк — из кэша
    const cached = JSON.parse(localStorage.getItem('data_json') || 'null');
    if (cached?.data?.theme) {
      document.documentElement.setAttribute('data-theme', cached.data.theme);
    }
  }
}

// ===== НОВОСТИ =====
async function loadNews(branch) {
  const list = document.getElementById('newsList');
  
  // Кэш
  const cached = getCached('issues_news_all');
  if (cached) renderNews(cached);
  
  // Свежие данные
  try {
    const res = await fetchWithTimeout(`${API}/issues?labels=${encodeURIComponent('новость')}&state=open&sort=created&direction=desc&per_page=50&t=${Date.now()}`);
    if (res.ok) {
      const news = (await res.json()).filter(i => !i.pull_request);
      setCached('issues_news_all', news);
      renderNews(news);
      return;
    }
  } catch (e) {
    console.warn('API недоступен');
  }
  
  // Если нет кэша и API упал
  if (!cached) {
    list.innerHTML = `<div class="empty"><div class="icon">📡</div><p>Не удалось загрузить новости.<br>Обновите страницу чуть позже.</p></div>`;
  }
}

function renderNews(news) {
  const list = document.getElementById('newsList');
  if (!news || news.length === 0) {
    const cached = getCached('data_json');
    list.innerHTML = `<div class="empty"><div class="icon">📭</div><p>${esc(cached?.news_empty || 'Новостей пока нет.')}</p></div>`;
    return;
  }
  list.innerHTML = news.map((n, i) => `
    <div class="news-card" style="transition-delay:${i * 0.1}s">
      <div class="news-date">${new Date(n.created_at).toLocaleDateString('ru-RU')}</div>
      <div class="news-title">${esc(n.title)}</div>
      <div class="news-text">${esc(n.body || '')}</div>
    </div>
  `).join('');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.news-card').forEach(card => observer.observe(card));
}

// ===== ТЕМЫ (локальный переключатель) =====
document.querySelectorAll('.theme-btn').forEach(b => {
  b.onclick = () => {
    document.documentElement.setAttribute('data-theme', b.dataset.set);
    localStorage.setItem('site-theme', b.dataset.set);
    document.querySelectorAll('.theme-btn').forEach(x => x.classList.toggle('active', x.dataset.set === b.dataset.set));
  };
});

// ===== ЧАСТИЦЫ (адаптивно) =====
const isMobile = window.innerWidth < 768;
const pc = document.getElementById('particles');
for (let i = 0; i < (isMobile ? 12 : 25); i++) {
  const p = document.createElement('div'); p.classList.add('particle');
  const s = Math.random() * 3 + 1;
  p.style.width = `${s}px`; p.style.height = `${s}px`;
  p.style.left = `${Math.random() * 100}vw`;
  p.style.animationDuration = `${Math.random() * 10 + 6}s`;
  p.style.animationDelay = `${Math.random() * 5}s`;
  pc.appendChild(p);
}

// ===== СТАРТ (параллельно) =====
(async () => {
  const branch = await getBranch();
  await Promise.all([loadTheme(branch), loadNews(branch)]);
})();
</script>
</body>
</html>
