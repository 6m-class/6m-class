<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новости класса | Самый лучший класс</title>
<link rel="preconnect" href="https://api.github.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="settings.js"></script>
<style>
:root{--primary:#ff0033;--primary-rgb:255,0,51;--glow:rgba(255,0,51,0.15);--glow-strong:rgba(255,0,51,0.8);--border:rgba(255,0,51,0.3);--shadow:rgba(255,0,51,0.2)}
[data-theme="yellow"]{--primary:#ffcc00;--primary-rgb:255,204,0;--glow:rgba(255,204,0,0.15);--glow-strong:rgba(255,204,0,0.8);--border:rgba(255,204,0,0.3);--shadow:rgba(255,204,0,0.2)}
[data-theme="green"]{--primary:#00ff66;--primary-rgb:0,255,102;--glow:rgba(0,255,102,0.15);--glow-strong:rgba(0,255,102,0.8);--border:rgba(0,255,102,0.3);--shadow:rgba(0,255,102,0.2)}
[data-theme="blue"]{--primary:#00aaff;--primary-rgb:0,170,255;--glow:rgba(0,170,255,0.15);--glow-strong:rgba(0,170,255,0.8);--border:rgba(0,170,255,0.3);--shadow:rgba(0,170,255,0.2)}
[data-theme="purple"]{--primary:#aa00ff;--primary-rgb:170,0,255;--glow:rgba(170,0,255,0.15);--glow-strong:rgba(170,0,255,0.8);--border:rgba(170,0,255,0.3);--shadow:rgba(170,0,255,0.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden}
.bg-glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100vw;height:60vh;background:radial-gradient(ellipse at top,var(--glow),transparent 70%);z-index:-2;pointer-events:none}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.particle{position:absolute;background:var(--primary);border-radius:50%;box-shadow:0 0 5px var(--primary);animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:0.4}100%{transform:translateY(-10vh) scale(1);opacity:0}}
nav{padding:20px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(5,5,5,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.back-btn{color:#fff;text-decoration:none;font-weight:700;text-transform:uppercase;font-size:0.9rem;padding:8px 20px;border:1px solid rgba(255,255,255,0.3);border-radius:4px;transition:0.3s}
.back-btn:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 0 10px var(--shadow)}
.gear-link{font-size:1.4rem;text-decoration:none;opacity:0.5;transition:0.3s;filter:grayscale(1)}
.gear-link:hover{opacity:1;color:var(--primary);filter:none}
.container{max-width:800px;margin:0 auto;padding:60px 20px 80px}
h1{font-family:'Orbitron',sans-serif;font-size:clamp(2rem,5vw,3rem);text-align:center;margin-bottom:10px;text-transform:uppercase;text-shadow:0 0 15px var(--glow-strong);animation:fadeInDown 0.8s ease-out}
.highlight{color:var(--primary)}
.subtitle{text-align:center;color:#888;margin-bottom:50px;font-size:1rem;animation:fadeInDown 0.8s ease-out 0.2s both}
.news-list{display:flex;flex-direction:column;gap:25px}
.news-card{background:rgba(20,20,20,0.6);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:30px;position:relative;overflow:hidden;transition:all 0.4s ease;opacity:0;transform:translateY(30px)}
.news-card.visible{opacity:1;transform:translateY(0)}
.news-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--primary);box-shadow:0 0 15px var(--shadow)}
.news-card:hover{border-color:var(--border);transform:translateY(-4px);box-shadow:0 10px 40px rgba(0,0,0,0.4)}
.news-date{font-size:0.75rem;color:var(--primary);text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-bottom:10px;display:inline-block;background:rgba(255,255,255,0.03);padding:4px 12px;border-radius:20px}
.news-title{font-family:'Orbitron',sans-serif;font-size:1.4rem;color:#fff;margin-bottom:12px;text-transform:uppercase;line-height:1.3}
.news-text{color:#bbb;font-size:1rem;line-height:1.7}
.news-video-wrap{margin-top:20px;border-radius:10px;overflow:hidden;background:#000}
.news-video-wrap video{width:100%;display:block;max-height:500px}
.news-video-wrap iframe{width:100%;height:400px;border:none;display:block}
.news-video-link{display:inline-block;margin-top:15px;color:var(--primary);text-decoration:none;font-weight:600}
.news-video-link:hover{text-decoration:underline}
.loading{text-align:center;padding:60px 20px;color:#555}
.loading .spinner{display:inline-block;width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:#555}
.empty .icon{font-size:3rem;margin-bottom:15px}
.empty p{font-size:1.1rem}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="particles" id="particles"></div>
<nav>
    <a href="index.html" class="back-btn">← На главную</a>
    <a href="settings.html" class="gear-link" title="Настройки">⚙</a>
</nav>
<div class="container">
    <h1>Новости <span class="highlight">класса</span></h1>
    <p class="subtitle">Всё самое важное и интересное</p>
    <div class="news-list" id="newsList">
        <div class="loading"><div class="spinner"></div><p>Загрузка новостей...</p></div>
    </div>
</div>
<script>
const REPO = '6m-class/6m-class';
const API = 'https://api.github.com/repos/'+REPO;

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function fetchWithTimeout(url,opts={},ms=8000){const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),ms);return fetch(url,{...opts,signal:ctrl.signal}).finally(()=>clearTimeout(timer));}

function parseVideo(body){
    if(!body) return {text:'',videoHtml:''};
    const match=body.match(/\[VIDEO\](.*?)\[\/VIDEO\]/i);
    let videoUrl='',text=body;
    if(match){videoUrl=match[1].trim();text=body.replace(/\[VIDEO\].*?\[\/VIDEO\]/gi,'').trim();}
    if(!videoUrl) return {text:esc(body),videoHtml:''};
    let videoHtml='',m;
    if(m=videoUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/)){
        videoHtml='<iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"></iframe>';
    }else if(m=videoUrl.match(/rutube\.ru\/video\/([\w]+)/)){
        videoHtml='<iframe src="https://rutube.ru/play/embed/'+m[1]+'" allowfullscreen></iframe>';
    }else if(m=videoUrl.match(/vimeo\.com\/(\d+)/)){
        videoHtml='<iframe src="https://player.vimeo.com/video/'+m[1]+'" allowfullscreen></iframe>';
    }else if(m=videoUrl.match(/vk\.com\/video.*?oid=(-?\d+).*?id=(\d+)/)){
        videoHtml='<iframe src="https://vk.com/video_ext.php?oid='+m[1]+'&id='+m[2]+'&hd=2" allowfullscreen></iframe>';
    }else if(m=videoUrl.match(/vk\.com\/video\/(-?\d+)_(\d+)/)){
        videoHtml='<iframe src="https://vk.com/video_ext.php?oid='+m[1]+'&id='+m[2]+'&hd=2" allowfullscreen></iframe>';
    }else if(videoUrl.match(/\.(mp4|webm|ogg|mov)(\?|$)/i)){
        videoHtml='<video controls preload="metadata" playsinline><source src="'+esc(videoUrl)+'" type="video/mp4">Ваш браузер не поддерживает воспроизведение видео.</video>';
    }else{
        videoHtml='<a href="'+esc(videoUrl)+'" target="_blank" class="news-video-link">▶ Открыть видео</a>';
    }
    return {text:esc(text),videoHtml};
}

async function loadNews(){
    const list=document.getElementById('newsList');
    const cacheKey='cache_issues_новость';
    const cached=localStorage.getItem(cacheKey);
    try{
        const r=await fetchWithTimeout(API+'/issues?labels='+encodeURIComponent('новость')+'&state=open&sort=created&direction=desc&per_page=50&t='+Date.now(),{cache:'no-store'},8000);
        if(!r.ok) throw new Error(r.status);
        const data=await r.json();
        const news=Array.isArray(data)?data.filter(i=>!i.pull_request):[];
        localStorage.setItem(cacheKey,JSON.stringify({time:Date.now(),data:news}));
        renderNews(news);
    }catch(e){
        if(cached){try{const obj=JSON.parse(cached);renderNews(obj.data);return;}catch(err){}}
        list.innerHTML='<div class="empty"><div class="icon">📡</div><p>Не удалось загрузить новости.<br>Попробуйте обновить страницу.</p></div>';
    }
}

function renderNews(news){
    const list=document.getElementById('newsList');
    if(!news||news.length===0){list.innerHTML='<div class="empty"><div class="icon">📰</div><p>Новостей пока нет.</p></div>';return;}
    list.innerHTML=news.map((n,i)=>{
        const parsed=parseVideo(n.body);
        const videoBlock=parsed.videoHtml?'<div class="news-video-wrap">'+parsed.videoHtml+'</div>':'';
        return '<div class="news-card" style="transition-delay:'+i*0.1+'s"><div class="news-date">'+new Date(n.created_at).toLocaleDateString('ru-RU')+'</div><div class="news-title">'+esc(n.title)+'</div><div class="news-text">'+parsed.text+'</div>'+videoBlock+'</div>';
    }).join('');
    const observer=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible');});},{threshold:0.1});
    document.querySelectorAll('.news-card').forEach(card=>observer.observe(card));
}

const isMobile=window.innerWidth<600;
const pc=document.getElementById('particles');
const count=isMobile?12:25;
for(let i=0;i<count;i++){const p=document.createElement('div');p.classList.add('particle');const s=Math.random()*3+1;p.style.width=s+'px';p.style.height=s+'px';p.style.left=Math.random()*100+'vw';p.style.animationDuration=Math.random()*10+6+'s';p.style.animationDelay=Math.random()*5+'s';pc.appendChild(p);}

loadNews();
</script>
</body>
</html>
